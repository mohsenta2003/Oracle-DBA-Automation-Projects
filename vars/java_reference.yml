# TRACK_KEY must be unique. Convention: "<VENDOR>-<MAJOR>".
# RELEASE_DATE / EOL_DATE in YYYY-MM-DD (or empty).
# Sources: oracle.com/java/technologies/java-se-support-roadmap, adoptium.net,
#          endoflife.date/java. Update periodically.

