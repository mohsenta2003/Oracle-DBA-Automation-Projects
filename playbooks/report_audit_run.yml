---
# playbooks/report_audit_run.yml
#
# Generate and email the Oracle Options Audit report from an EXISTING run
# stored in the central DB — WITHOUT re-running against any Oracle hosts.
#
# Usage:
#   ansible-playbook playbooks/report_audit_run.yml -i ansibleInventory/inv_key.yml
#   ansible-playbook playbooks/report_audit_run.yml -i ansibleInventory/inv_key.yml -e "report_run_id=22"
#   ansible-playbook playbooks/report_audit_run.yml -i ansibleInventory/inv_key.yml -e "report_run_id=22 send_summary_email=true"
#   ansible-playbook playbooks/report_audit_run.yml -i ansibleInventory/inv_key.yml -e "list_runs_only=true"

- name: Oracle Options Audit — Report from DB
  hosts: localhost
  connection: local
  gather_facts: no
  become: no
  
  vars_files:
    - ../vars/repo_config.yml
  
  vars:
    report_run_id:             ""     # Specify exact RUN_ID(s), comma-separated. Leave empty for auto-detect.
    list_runs_only:            false
    send_summary_email:        true
    email_skip_empty_sections: false
    smtp_port:  25

    # Import the same option list used during collection to ensure name matching works
    # This list must match what's stored in ORACLE_OPT_VOPTION.OPTION_NAME
    ee_extra_options:
      - "Real Application Clusters"
      - "RAC"
      - "Real Application Clusters One Node"
      - "Active Data Guard"
      - "Active Data Guard - Real-Time Query"
      - "GoldenGate"
      - "Multitenant"
      - "Partitioning"
      - "Advanced Compression"
      - "Advanced Security"
      - "Advanced Security Option"
      - "Label Security"
      - "Database Vault"
      - "Oracle Database Vault"
      - "In-Memory Column Store"
      - "In-Memory Database Cache"
      - "OLAP"
      - "Oracle OLAP"
      - "Data Mining"
      - "Oracle Data Mining"
      - "Advanced Analytics"
      - "Oracle Advanced Analytics"
      - "Spatial"
      - "Spatial and Graph"
      - "Real Application Testing"
      - "Database Replay"
      - "SQL Performance Analyzer"
      - "Diagnostics Pack"
      - "Tuning Pack"
      - "Database Lifecycle Management Pack"
      - "Data Masking and Subsetting Pack"
      - "Data Masking Pack"
      - "Cloud Management Pack for Oracle Database"
      - "Change Management Pack"
      - "Configuration Management Pack"
      - "Provisioning and Patch Automation Pack"

    _conn: "{{ repo_tns_alias if (repo_tns_alias | default('')) else '(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=' ~ repo_host ~ ')(PORT=' ~ repo_port ~ '))(CONNECT_DATA=(SID=' ~ repo_sid ~ ')))' }}"

  tasks:

    - name: Define newline helper
      ansible.builtin.set_fact:
        _nl: "\n"

    # ── List available runs ────────────────────────────────────────────────────
    - name: List available runs in DB
      ansible.builtin.shell:
        cmd: |
          sqlplus -s /nolog << 'EOSQL'
          CONNECT {{ repo_user }}/"{{ repo_password }}"@{{ _repo_conn_string }}
          SET HEADING ON FEEDBACK OFF PAGESIZE 50 LINESIZE 120
          SET COLSEP '|'
          COLUMN RUN_ID    FORMAT 9999
          COLUMN RUN_LABEL FORMAT A40
          COLUMN RUN_DATE  FORMAT A20
          COLUMN HOSTS     FORMAT 9999
          COLUMN INSTANCES FORMAT 9999
          SELECT RUN_ID,
                 SUBSTR(RUN_LABEL,1,40) AS RUN_LABEL,
                 TO_CHAR(RUN_DATE,'YYYY-MM-DD HH24:MI') AS RUN_DATE,
                 TOTAL_HOSTS AS HOSTS,
                 TOTAL_INSTANCES AS INSTANCES
          FROM {{ repo_schema | upper }}.ORACLE_OPT_RUNS
          ORDER BY RUN_ID DESC
          FETCH FIRST 20 ROWS ONLY;
          EXIT;
          EOSQL
      register: _run_list
      changed_when: false

    - name: Show available runs
      ansible.builtin.debug:
        msg: "{{ _run_list.stdout_lines }}"

    - name: Stop here if list_runs_only
      ansible.builtin.meta: end_play
      when: list_runs_only | bool

    # ── Resolve RUN_ID(s) ──────────────────────────────────────────────────────
    # DEFAULT: Show ALL hosts with their individual latest RUN_ID (per-host latest)
    # OVERRIDE: Use specific report_run_id if provided
    
    - name: Resolve all hosts with their latest RUN_ID (DEFAULT - per-host latest)
      ansible.builtin.shell:
        cmd: |
          sqlplus -s /nolog << 'EOSQL'
          CONNECT {{ repo_user }}/"{{ repo_password }}"@{{ _repo_conn_string }}
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0
          SELECT LISTAGG(DISTINCT run_id, ',') WITHIN GROUP (ORDER BY run_id)
          FROM (
            SELECT i.hostname, MAX(i.run_id) AS run_id
            FROM {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i
            GROUP BY i.hostname
          );
          EXIT;
          EOSQL
      register: _all_hosts_runs
      changed_when: false
      when: report_run_id == ""

    - name: Set effective RUN_ID(s)
      ansible.builtin.set_fact:
        _eff_run_id: >-
          {%- if report_run_id != '' -%}
            {{ report_run_id }}
          {%- else -%}
            {{ _all_hosts_runs.stdout | default('') | trim }}
          {%- endif -%}
        _report_mode: >-
          {%- if report_run_id != '' -%}
            specific
          {%- else -%}
            all_hosts
          {%- endif -%}

    - name: Fail if no runs found
      ansible.builtin.fail:
        msg: "No runs found in {{ repo_schema | upper }}.ORACLE_OPT_RUNS. Run the audit first."
      when: _eff_run_id == "" or _eff_run_id == "None"

    - name: Show selected RUN_ID(s)
      ansible.builtin.debug:
        msg: >-
          {%- if _report_mode == 'all_hosts' -%}
          Generating report for ALL HOSTS (each host's latest individual audit) — RUN_IDs: {{ _eff_run_id }}
          {%- elif _report_mode == 'specific' -%}
          Generating report for specific RUN_ID(s): {{ _eff_run_id }}
          {%- endif -%}

    # ── Fetch run header ───────────────────────────────────────────────────────
    - name: Fetch run header (all hosts mode - per-host latest)
      ansible.builtin.shell:
        cmd: |
          sqlplus -s /nolog << 'EOSQL'
          CONNECT {{ repo_user }}/"{{ repo_password }}"@{{ _repo_conn_string }}
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 LINESIZE 400
          WITH host_latest_run AS (
            SELECT i.hostname, MAX(i.run_id) AS run_id
            FROM {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i
            WHERE i.run_id IN ({{ _eff_run_id }})
            GROUP BY i.hostname
          ),
          run_summary AS (
            SELECT
              r.run_id,
              r.run_label,
              r.run_date,
              COUNT(DISTINCT hlr.hostname) AS host_count,
              COUNT(DISTINCT i.hostname || '|' || i.sid) AS instance_count,
              COUNT(CASE WHEN i.is_standby = 'Y' THEN 1 END) AS standby_count,
              COUNT(CASE WHEN i.was_queried = 'N' AND i.is_standby = 'N' THEN 1 END) AS skipped_count
            FROM host_latest_run hlr
            JOIN {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i ON i.hostname = hlr.hostname AND i.run_id = hlr.run_id
            JOIN {{ repo_schema | upper }}.ORACLE_OPT_RUNS r ON r.run_id = hlr.run_id
            GROUP BY r.run_id, r.run_label, r.run_date
          )
          SELECT
            NVL(LISTAGG(run_id, ',') WITHIN GROUP (ORDER BY run_id), '') || '|' ||
            NVL(LISTAGG(SUBSTR(run_label,1,30), '; ') WITHIN GROUP (ORDER BY run_id), '') || '|' ||
            NVL(TO_CHAR(MIN(run_date),'YYYY-MM-DD'), '') || '|' ||
            NVL(TO_CHAR(SUM(host_count)), '0') || '|' ||
            NVL(TO_CHAR(SUM(instance_count)), '0') || '|' ||
            NVL(TO_CHAR(SUM(standby_count)), '0') || '|' ||
            NVL(TO_CHAR(SUM(skipped_count)), '0')
          FROM run_summary;
          EXIT;
          EOSQL
      register: _run_hdr_raw
      changed_when: false
      when: _report_mode == 'all_hosts'

    - name: Fetch run header (specific mode only)
      ansible.builtin.shell:
        cmd: |
          sqlplus -s /nolog << 'EOSQL'
          CONNECT {{ repo_user }}/"{{ repo_password }}"@{{ _repo_conn_string }}
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 LINESIZE 400
          WITH run_summary AS (
            SELECT
              r.run_id,
              r.run_label,
              r.run_date,
              r.total_hosts,
              r.total_instances,
              COUNT(CASE WHEN i.is_standby = 'Y' THEN 1 END) AS standby_count,
              COUNT(CASE WHEN i.was_queried = 'N' AND i.is_standby = 'N' THEN 1 END) AS skipped_count
            FROM {{ repo_schema | upper }}.ORACLE_OPT_RUNS r
            LEFT JOIN {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i ON i.run_id = r.run_id
            WHERE r.run_id IN ({{ _eff_run_id }})
            GROUP BY r.run_id, r.run_label, r.run_date, r.total_hosts, r.total_instances
          )
          SELECT
            NVL(LISTAGG(run_id, ',') WITHIN GROUP (ORDER BY run_id), '') || '|' ||
            NVL(LISTAGG(SUBSTR(run_label,1,30), '; ') WITHIN GROUP (ORDER BY run_id), '') || '|' ||
            NVL(TO_CHAR(MIN(run_date),'YYYY-MM-DD'), '') || '|' ||
            NVL(TO_CHAR(SUM(NVL(total_hosts,0))), '0') || '|' ||
            NVL(TO_CHAR(SUM(NVL(total_instances,0))), '0') || '|' ||
            NVL(TO_CHAR(SUM(standby_count)), '0') || '|' ||
            NVL(TO_CHAR(SUM(skipped_count)), '0')
          FROM run_summary;
          EXIT;
          EOSQL
      register: _run_hdr_raw_specific
      changed_when: false
      when: _report_mode == 'specific'

    - name: Set run header variable
      ansible.builtin.set_fact:
        _run_hdr_raw: "{{ _run_hdr_raw_specific }}"
      when: _report_mode == 'specific'

    - name: Debug run header output
      ansible.builtin.debug:
        msg: "Run header SQL output: '{{ _run_hdr_raw.stdout | trim }}'"
      when: _run_hdr_raw is defined and _run_hdr_raw.stdout is defined

    - name: Parse run header
      ansible.builtin.set_fact:
        _rpt_run_id:  "{{ (_run_hdr_raw.stdout | trim).split('|')[0] }}"
        _rpt_label:   "{{ (_run_hdr_raw.stdout | trim).split('|')[1] }}"
        _rpt_date:    "{{ (_run_hdr_raw.stdout | trim).split('|')[2] }}"
        _rpt_hosts:   "{{ (_run_hdr_raw.stdout | trim).split('|')[3] }}"
        _rpt_queried: "{{ (_run_hdr_raw.stdout | trim).split('|')[4] }}"
        _rpt_standby: "{{ (_run_hdr_raw.stdout | trim).split('|')[5] }}"
        _rpt_skipped: "{{ (_run_hdr_raw.stdout | trim).split('|')[6] }}"
        _report_timestamp: "{{ lookup('pipe', 'date +%Y-%m-%d_%H-%M-%S') }}"

    # ── Fetch platform breakdown (for multi-platform reports) ─────────────────
    - name: Fetch platform breakdown (all hosts mode - per-host latest)
      ansible.builtin.shell:
        cmd: |
          sqlplus -s /nolog << 'EOSQL'
          CONNECT {{ repo_user }}/"{{ repo_password }}"@{{ _repo_conn_string }}
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 LINESIZE 400
          WITH host_latest_run AS (
            SELECT i.hostname, MAX(i.run_id) AS run_id
            FROM {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i
            WHERE i.run_id IN ({{ _eff_run_id }})
            GROUP BY i.hostname
          )
          SELECT
            CASE
              WHEN UPPER(i.os_type) = 'AIX' THEN 'AIX'
              WHEN UPPER(i.os_type) LIKE '%LINUX%' AND UPPER(i.region) LIKE '%EU%' THEN 'EU-Linux'
              WHEN UPPER(i.os_type) LIKE '%LINUX%' THEN 'US-Linux'
              ELSE 'Other'
            END || '|' ||
            CASE
              WHEN UPPER(i.hostname) LIKE 'CRLNXP%' OR UPPER(i.hostname) LIKE 'UKLNXP%' 
                   OR UPPER(i.hostname) LIKE 'UKAIXP%' OR UPPER(i.hostname) LIKE 'DCUP%' 
                   OR UPPER(i.hostname) LIKE 'CRANXP%' OR UPPER(i.hostname) LIKE 'IP-%' THEN 'Production'
              WHEN UPPER(i.hostname) LIKE 'CRLNXM%' THEN 'Model'
              WHEN UPPER(i.hostname) LIKE 'CRLNXT%' OR UPPER(i.hostname) LIKE 'CRLNXD%' 
                   OR UPPER(i.hostname) LIKE 'UKLNXT%' OR UPPER(i.hostname) LIKE 'UKAIXT%' 
                   OR UPPER(i.hostname) LIKE 'DCUNX%' THEN 'Test-Dev'
              ELSE 'Other'
            END || '|' ||
            TO_CHAR(MAX(hlr.run_id)) || '|' ||
            TO_CHAR(MAX(r.run_date), 'YYYY-MM-DD HH24:MI') || '|' ||
            TO_CHAR(COUNT(DISTINCT i.hostname)) || '|' ||
            TO_CHAR(COUNT(DISTINCT i.sid)) AS platform_info
          FROM host_latest_run hlr
          JOIN {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i ON i.hostname = hlr.hostname AND i.run_id = hlr.run_id
          JOIN {{ repo_schema | upper }}.ORACLE_OPT_RUNS r ON r.run_id = hlr.run_id
          GROUP BY
            CASE
              WHEN UPPER(i.os_type) = 'AIX' THEN 'AIX'
              WHEN UPPER(i.os_type) LIKE '%LINUX%' AND UPPER(i.region) LIKE '%EU%' THEN 'EU-Linux'
              WHEN UPPER(i.os_type) LIKE '%LINUX%' THEN 'US-Linux'
              ELSE 'Other'
            END,
            CASE
              WHEN UPPER(i.hostname) LIKE 'CRLNXP%' OR UPPER(i.hostname) LIKE 'UKLNXP%' 
                   OR UPPER(i.hostname) LIKE 'UKAIXP%' OR UPPER(i.hostname) LIKE 'DCUP%' 
                   OR UPPER(i.hostname) LIKE 'CRANXP%' OR UPPER(i.hostname) LIKE 'IP-%' THEN 'Production'
              WHEN UPPER(i.hostname) LIKE 'CRLNXM%' THEN 'Model'
              WHEN UPPER(i.hostname) LIKE 'CRLNXT%' OR UPPER(i.hostname) LIKE 'CRLNXD%' 
                   OR UPPER(i.hostname) LIKE 'UKLNXT%' OR UPPER(i.hostname) LIKE 'UKAIXT%' 
                   OR UPPER(i.hostname) LIKE 'DCUNX%' THEN 'Test-Dev'
              ELSE 'Other'
            END
          ORDER BY 1, 2;
          EXIT;
          EOSQL
      register: _platform_breakdown_raw
      changed_when: false
      when: _report_mode == 'all_hosts'

    - name: Fetch platform breakdown
      ansible.builtin.shell:
        cmd: |
          sqlplus -s /nolog << 'EOSQL'
          CONNECT {{ repo_user }}/"{{ repo_password }}"@{{ _repo_conn_string }}
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 LINESIZE 400
          SELECT
            CASE
              WHEN UPPER(i.os_type) = 'AIX' THEN 'AIX'
              WHEN UPPER(i.os_type) LIKE '%LINUX%' AND UPPER(i.region) LIKE '%EU%' THEN 'EU-Linux'
              WHEN UPPER(i.os_type) LIKE '%LINUX%' THEN 'US-Linux'
              ELSE 'Other'
            END || '|' ||
            TO_CHAR(i.run_id) || '|' ||
            TO_CHAR(r.run_date, 'YYYY-MM-DD HH24:MI') || '|' ||
            TO_CHAR(COUNT(DISTINCT i.hostname)) || '|' ||
            TO_CHAR(COUNT(DISTINCT i.sid)) AS platform_info
          FROM {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i
          JOIN {{ repo_schema | upper }}.ORACLE_OPT_RUNS r ON r.run_id = i.run_id
          WHERE i.RUN_ID IN ({{ _eff_run_id }})
          GROUP BY
            CASE
              WHEN UPPER(i.os_type) = 'AIX' THEN 'AIX'
              WHEN UPPER(i.os_type) LIKE '%LINUX%' AND UPPER(i.region) LIKE '%EU%' THEN 'EU-Linux'
              WHEN UPPER(i.os_type) LIKE '%LINUX%' THEN 'US-Linux'
              ELSE 'Other'
            END,
            i.run_id,
            TO_CHAR(r.run_date, 'YYYY-MM-DD HH24:MI')
          ORDER BY platform_type;
          EXIT;
          EOSQL
      register: _platform_breakdown_raw
      changed_when: false
      when: _report_mode != 'all_hosts'

    # ── Fetch all distinct hosts with audit status ────────────────────────────
    - name: Fetch all hosts with latest audit status (all hosts mode)
      ansible.builtin.shell:
        cmd: |
          sqlplus -s /nolog << 'EOSQL'
          CONNECT {{ repo_user }}/"{{ repo_password }}"@{{ _repo_conn_string }}
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 LINESIZE 500 WRAP OFF TRIMSPOOL ON
          WITH host_latest_run AS (
            SELECT i.hostname, MAX(i.run_id) AS run_id
            FROM {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i
            WHERE i.run_id IN ({{ _eff_run_id }})
            GROUP BY i.hostname
          ),
          host_summary AS (
            SELECT
              i.hostname,
              hlr.run_id,
              CASE
                WHEN UPPER(i.os_type) = 'AIX' THEN 'AIX'
                WHEN UPPER(i.os_type) LIKE '%LINUX%' AND UPPER(i.region) LIKE '%EU%' THEN 'EU-Linux'
                WHEN UPPER(i.os_type) LIKE '%LINUX%' THEN 'US-Linux'
                ELSE 'Other'
              END AS platform_type,
              CASE
                WHEN UPPER(i.hostname) LIKE 'CRLNXP%' OR UPPER(i.hostname) LIKE 'UKLNXP%' 
                     OR UPPER(i.hostname) LIKE 'UKAIXP%' OR UPPER(i.hostname) LIKE 'DCUP%' 
                     OR UPPER(i.hostname) LIKE 'CRANXP%' OR UPPER(i.hostname) LIKE 'IP-%' THEN 'Production'
                WHEN UPPER(i.hostname) LIKE 'CRLNXM%' THEN 'Model'
                WHEN UPPER(i.hostname) LIKE 'CRLNXT%' OR UPPER(i.hostname) LIKE 'CRLNXD%' 
                     OR UPPER(i.hostname) LIKE 'UKLNXT%' OR UPPER(i.hostname) LIKE 'UKAIXT%' 
                     OR UPPER(i.hostname) LIKE 'DCUNX%' THEN 'Test-Dev'
                ELSE 'Other'
              END AS environment,
              NVL(i.region, 'US') AS region,
              MAX(r.run_date) AS latest_audit_date,
              COUNT(DISTINCT i.sid) AS instance_count,
              COUNT(CASE WHEN i.is_standby = 'Y' THEN 1 END) AS standby_count
            FROM host_latest_run hlr
            JOIN {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i ON i.hostname = hlr.hostname AND i.run_id = hlr.run_id
            JOIN {{ repo_schema | upper }}.ORACLE_OPT_RUNS r ON r.run_id = hlr.run_id
            GROUP BY i.hostname, hlr.run_id,
              CASE
                WHEN UPPER(i.os_type) = 'AIX' THEN 'AIX'
                WHEN UPPER(i.os_type) LIKE '%LINUX%' AND UPPER(i.region) LIKE '%EU%' THEN 'EU-Linux'
                WHEN UPPER(i.os_type) LIKE '%LINUX%' THEN 'US-Linux'
                ELSE 'Other'
              END,
              CASE
                WHEN UPPER(i.hostname) LIKE 'CRLNXP%' OR UPPER(i.hostname) LIKE 'UKLNXP%' 
                     OR UPPER(i.hostname) LIKE 'UKAIXP%' OR UPPER(i.hostname) LIKE 'DCUP%' 
                     OR UPPER(i.hostname) LIKE 'CRANXP%' OR UPPER(i.hostname) LIKE 'IP-%' THEN 'Production'
                WHEN UPPER(i.hostname) LIKE 'CRLNXM%' THEN 'Model'
                WHEN UPPER(i.hostname) LIKE 'CRLNXT%' OR UPPER(i.hostname) LIKE 'CRLNXD%' 
                     OR UPPER(i.hostname) LIKE 'UKLNXT%' OR UPPER(i.hostname) LIKE 'UKAIXT%' 
                     OR UPPER(i.hostname) LIKE 'DCUNX%' THEN 'Test-Dev'
                ELSE 'Other'
              END,
              NVL(i.region, 'US')
          ),
          host_licenses AS (
            SELECT
              v.hostname,
              LISTAGG(DISTINCT CASE WHEN v.IS_INUSE = 'Y' THEN v.OPTION_NAME END, '; ') WITHIN GROUP (ORDER BY v.OPTION_NAME) AS licensed_options_inuse
            FROM {{ repo_schema | upper }}.ORACLE_OPT_VOPTION v
            JOIN host_latest_run hlr ON hlr.hostname = v.hostname AND hlr.run_id = v.run_id
            WHERE v.IS_EE_EXTRA = 'Y'
            GROUP BY v.hostname
          )
          SELECT
            hs.platform_type || '|' ||
            hs.environment || '|' ||
            hs.region || '|' ||
            hs.hostname || '|' ||
            TO_CHAR(hs.run_id) || '|' ||
            TO_CHAR(hs.latest_audit_date, 'YYYY-MM-DD HH24:MI') || '|' ||
            TO_CHAR(hs.instance_count) || '|' ||
            TO_CHAR(hs.standby_count) || '|' ||
            NVL(hl.licensed_options_inuse, 'None')
          FROM host_summary hs
          LEFT JOIN host_licenses hl ON hl.hostname = hs.hostname
          ORDER BY hs.platform_type, hs.environment, hs.region, hs.hostname;
          EXIT;
          EOSQL
      register: _all_hosts_status_raw
      changed_when: false
      when: _report_mode == 'all_hosts'

    # ── Fetch EE license statistics for email summary ─────────────────────────
    - name: Fetch overall EE license statistics (all hosts mode)
      ansible.builtin.shell:
        cmd: |
          sqlplus -s /nolog << 'EOSQL'
          CONNECT {{ repo_user }}/"{{ repo_password }}"@{{ _repo_conn_string }}
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 LINESIZE 400 WRAP OFF TRIMSPOOL ON
          WITH host_latest_run AS (
            SELECT i.hostname, MAX(i.run_id) AS run_id
            FROM {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i
            WHERE i.run_id IN ({{ _eff_run_id }})
            GROUP BY i.hostname
          ),
          historical_usage AS (
            SELECT 
              vh.hostname,
              vh.sid,
              vh.option_name,
              MAX(CASE WHEN vh.is_inuse = 'Y' THEN 1 ELSE 0 END) AS ever_used
            FROM {{ repo_schema | upper }}.ORACLE_OPT_VOPTION vh
            WHERE vh.is_ee_extra = 'Y'
            GROUP BY vh.hostname, vh.sid, vh.option_name
          ),
          option_stats AS (
            SELECT
              v.OPTION_NAME,
              COUNT(DISTINCT CASE WHEN v.OPTION_ENABLED = 'TRUE' THEN v.HOSTNAME || '|' || v.SID END) AS enabled_instances,
              COUNT(DISTINCT CASE WHEN v.IS_INUSE = 'Y' THEN v.HOSTNAME || '|' || v.SID END) AS inuse_instances,
              COUNT(DISTINCT CASE WHEN v.OPTION_ENABLED = 'TRUE' THEN v.HOSTNAME END) AS enabled_hosts,
              COUNT(DISTINCT CASE WHEN v.IS_INUSE = 'Y' THEN v.HOSTNAME END) AS inuse_hosts,
              COUNT(DISTINCT CASE WHEN h.ever_used = 1 THEN v.HOSTNAME || '|' || v.SID END) AS ever_used_instances,
              COUNT(DISTINCT CASE WHEN h.ever_used = 1 THEN v.HOSTNAME END) AS ever_used_hosts
            FROM {{ repo_schema | upper }}.ORACLE_OPT_VOPTION v
            JOIN host_latest_run hlr ON hlr.hostname = v.HOSTNAME AND hlr.run_id = v.RUN_ID
            LEFT JOIN historical_usage h ON h.hostname = v.HOSTNAME AND h.sid = v.SID AND h.option_name = v.OPTION_NAME
            WHERE v.IS_EE_EXTRA = 'Y'
            GROUP BY v.OPTION_NAME
          )
          SELECT
            OPTION_NAME || '|' ||
            TO_CHAR(enabled_instances) || '|' ||
            TO_CHAR(inuse_instances) || '|' ||
            TO_CHAR(enabled_hosts) || '|' ||
            TO_CHAR(inuse_hosts) || '|' ||
            TO_CHAR(ever_used_instances) || '|' ||
            TO_CHAR(ever_used_hosts)
          FROM option_stats
          WHERE enabled_instances > 0 OR inuse_instances > 0 OR ever_used_instances > 0
          ORDER BY inuse_instances DESC, ever_used_instances DESC, enabled_instances DESC, OPTION_NAME;
          EXIT;
          EOSQL
      register: _ee_license_stats_raw
      changed_when: false
      when: _report_mode == 'all_hosts'

    # ── Fetch v$option / EE summary ───────────────────────────────────────────
    - name: Fetch voption rows from DB (all hosts mode - per-host latest)
      ansible.builtin.shell:
        cmd: |
          sqlplus -s /nolog << 'EOSQL'
          CONNECT {{ repo_user }}/"{{ repo_password }}"@{{ _repo_conn_string }}
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 LINESIZE 500 WRAP OFF TRIMSPOOL ON
          WITH host_latest_run AS (
            SELECT i.hostname, MAX(i.run_id) AS run_id
            FROM {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i
            WHERE i.run_id IN ({{ _eff_run_id }})
            GROUP BY i.hostname
          ),
          historical_usage AS (
            SELECT 
              vh.hostname,
              vh.sid,
              vh.option_name,
              MAX(CASE WHEN vh.is_inuse = 'Y' THEN 1 ELSE 0 END) AS ever_used,
              MAX(CASE WHEN vh.is_inuse = 'Y' THEN r.run_date END) AS last_used_date
            FROM {{ repo_schema | upper }}.ORACLE_OPT_VOPTION vh
            JOIN {{ repo_schema | upper }}.ORACLE_OPT_RUNS r ON r.run_id = vh.run_id
            WHERE vh.is_ee_extra = 'Y'
            GROUP BY vh.hostname, vh.sid, vh.option_name
          ),
          voption_with_instance AS (
            SELECT 
              v.option_name,
              v.hostname,
              v.sid,
              v.option_enabled,
              v.is_inuse,
              v.run_id,
              i.os_type,
              i.region
            FROM {{ repo_schema | upper }}.ORACLE_OPT_VOPTION v
            JOIN host_latest_run hlr ON hlr.hostname = v.hostname AND hlr.run_id = v.run_id
            JOIN {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i ON i.hostname = hlr.hostname AND i.run_id = hlr.run_id AND i.sid = v.sid
            WHERE v.is_ee_extra = 'Y'
          )
          SELECT 
            vi.option_name || '|' ||
            vi.hostname || '|' ||
            vi.sid || '|' ||
            vi.option_enabled || '|' ||
            vi.is_inuse || '|' ||
            CASE
              WHEN UPPER(vi.os_type) = 'AIX' THEN 'AIX'
              WHEN UPPER(vi.os_type) LIKE '%LINUX%' AND UPPER(vi.region) LIKE '%EU%' THEN 'EU-Linux'
              WHEN UPPER(vi.os_type) LIKE '%LINUX%' THEN 'US-Linux'
              ELSE 'Other'
            END || '|' ||
            CASE
              WHEN UPPER(vi.hostname) LIKE 'CRLNXP%' OR UPPER(vi.hostname) LIKE 'UKLNXP%' 
                   OR UPPER(vi.hostname) LIKE 'UKAIXP%' OR UPPER(vi.hostname) LIKE 'DCUP%' 
                   OR UPPER(vi.hostname) LIKE 'CRANXP%' OR UPPER(vi.hostname) LIKE 'IP-%' THEN 'Production'
              WHEN UPPER(vi.hostname) LIKE 'CRLNXM%' THEN 'Model'
              WHEN UPPER(vi.hostname) LIKE 'CRLNXT%' OR UPPER(vi.hostname) LIKE 'CRLNXD%' 
                   OR UPPER(vi.hostname) LIKE 'UKLNXT%' OR UPPER(vi.hostname) LIKE 'UKAIXT%' 
                   OR UPPER(vi.hostname) LIKE 'DCUNX%' THEN 'Test-Dev'
              ELSE 'Other'
            END || '|' ||
            NVL(TO_CHAR(h.ever_used), '0') || '|' ||
            NVL(TO_CHAR(h.last_used_date, 'YYYY-MM-DD'), 'NEVER') AS result
          FROM voption_with_instance vi
          LEFT JOIN historical_usage h ON h.hostname = vi.hostname AND h.sid = vi.sid AND h.option_name = vi.option_name
          ORDER BY vi.option_name, vi.is_inuse DESC, h.ever_used DESC, vi.hostname, vi.sid;
          EXIT;
          EOSQL
      register: _voption_raw
      changed_when: false
      when: _report_mode == 'all_hosts'

    - name: Fetch voption rows from DB (with platform info)
      ansible.builtin.shell:
        cmd: |
          sqlplus -s /nolog << 'EOSQL'
          CONNECT {{ repo_user }}/"{{ repo_password }}"@{{ _repo_conn_string }}
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 LINESIZE 500 WRAP OFF TRIMSPOOL ON
          WITH historical_usage AS (
            SELECT 
              vh.hostname,
              vh.sid,
              vh.option_name,
              MAX(CASE WHEN vh.is_inuse = 'Y' THEN 1 ELSE 0 END) AS ever_used,
              MAX(CASE WHEN vh.is_inuse = 'Y' THEN rh.run_date END) AS last_used_date
            FROM {{ repo_schema | upper }}.ORACLE_OPT_VOPTION vh
            JOIN {{ repo_schema | upper }}.ORACLE_OPT_RUNS rh ON rh.run_id = vh.run_id
            WHERE vh.run_id IN ({{ _eff_run_id }})
            AND vh.is_ee_extra = 'Y'
            GROUP BY vh.hostname, vh.sid, vh.option_name
          )
          SELECT v.option_name || '|' ||
                 v.hostname || '|' ||
                 v.sid || '|' ||
                 MAX(v.option_enabled) || '|' ||
                 MAX(v.is_inuse) || '|' ||
                 MAX(CASE
                   WHEN UPPER(i.os_type) = 'AIX' THEN 'AIX'
                   WHEN UPPER(i.os_type) LIKE '%LINUX%' AND UPPER(i.region) LIKE '%EU%' THEN 'EU-Linux'
                   WHEN UPPER(i.os_type) LIKE '%LINUX%' THEN 'US-Linux'
                   ELSE 'Other'
                 END) || '|' ||
                 MAX(CASE
                   WHEN UPPER(i.hostname) LIKE 'CRLNXP%' OR UPPER(i.hostname) LIKE 'UKLNXP%' 
                        OR UPPER(i.hostname) LIKE 'UKAIXP%' OR UPPER(i.hostname) LIKE 'DCUP%' 
                        OR UPPER(i.hostname) LIKE 'CRANXP%' OR UPPER(i.hostname) LIKE 'IP-%' THEN 'Production'
                   WHEN UPPER(i.hostname) LIKE 'CRLNXM%' THEN 'Model'
                   WHEN UPPER(i.hostname) LIKE 'CRLNXT%' OR UPPER(i.hostname) LIKE 'CRLNXD%' 
                        OR UPPER(i.hostname) LIKE 'UKLNXT%' OR UPPER(i.hostname) LIKE 'UKAIXT%' 
                        OR UPPER(i.hostname) LIKE 'DCUNX%' THEN 'Test-Dev'
                   ELSE 'Other'
                 END) || '|' ||
                 MAX(h.ever_used) || '|' ||
                 NVL(TO_CHAR(MAX(h.last_used_date), 'YYYY-MM-DD'), 'NEVER') AS result
          FROM {{ repo_schema | upper }}.ORACLE_OPT_VOPTION v
          JOIN {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i
            ON i.run_id = v.run_id AND i.hostname = v.hostname AND i.sid = v.sid
          LEFT JOIN historical_usage h 
            ON h.hostname = v.hostname AND h.sid = v.sid AND h.option_name = v.option_name
          WHERE v.run_id IN ({{ _eff_run_id }})
          AND   v.is_ee_extra = 'Y'
          GROUP BY v.option_name, v.hostname, v.sid
          ORDER BY v.option_name, MAX(v.is_inuse) DESC, MAX(h.ever_used) DESC, v.hostname, v.sid;
          EXIT;
          EOSQL
      register: _voption_raw_specific
      changed_when: false
      when: _report_mode != 'all_hosts'

    # ── Unify voption variable (copy specific mode result to main variable) ───
    - name: Set unified _voption_raw variable from specific mode
      ansible.builtin.set_fact:
        _voption_raw: "{{ _voption_raw_specific }}"
      when: _report_mode != 'all_hosts'

    # ── DEBUG: Show what _voption_raw query returned ──────────────────────────
    - name: DEBUG - Show _voption_raw query result stats
      ansible.builtin.debug:
        msg:
          - "==== VOPTION RAW QUERY DIAGNOSTICS ===="
          - "Query executed: {{ 'all_hosts' if _report_mode == 'all_hosts' else 'specific_run' }} mode"
          - "Effective RUN_ID(s): {{ _eff_run_id }}"
          - "Stdout defined: {{ _voption_raw.stdout is defined }}"
          - "Stderr defined: {{ _voption_raw.stderr is defined }}"
          - "Return code: {{ _voption_raw.rc | default('N/A') }}"
          - "Stdout length: {{ (_voption_raw.stdout | default('') | length) }} characters"
          - "Stderr length: {{ (_voption_raw.stderr | default('') | length) }} characters"
          - "Line count: {{ (_voption_raw.stdout | default('') | trim).split('\n') | length }}"
          - "First 5 lines of stdout:"
          - "{{ (_voption_raw.stdout | default('NO DATA') | trim).split('\n')[:5] | join('\n  ') }}"
          - "Stderr content:"
          - "{{ _voption_raw.stderr | default('NO STDERR') }}"
          - "======================================="
      when: _voption_raw is defined

    - name: Build EE options plain-text table (categorized by platform)
      ansible.builtin.set_fact:
        _rpt_ee_table: >-
          {%- set vopts = [] -%}
          {%- set unique_instances = [] -%}
          {%- for line in (_voption_raw.stdout | default('') | trim).split('\n') -%}
            {%- if '|' in line -%}
              {%- set p = line.split('|') -%}
              {%- if p | length >= 9 -%}
                {%- set _ = vopts.append({'name': p[0]|trim, 'host': p[1]|trim, 'sid': p[2]|trim, 'enabled': p[3]|trim, 'inuse': p[4]|trim, 'platform': p[5]|trim, 'environment': p[6]|trim, 'ever_used': p[7]|trim, 'last_used_date': p[8]|trim}) -%}
                {%- set inst_key = p[1]|trim ~ '|' ~ p[2]|trim -%}
                {%- if inst_key not in unique_instances -%}
                  {%- set _ = unique_instances.append(inst_key) -%}
                {%- endif -%}
              {%- elif p | length >= 7 -%}
                {%- set _ = vopts.append({'name': p[0]|trim, 'host': p[1]|trim, 'sid': p[2]|trim, 'enabled': p[3]|trim, 'inuse': p[4]|trim, 'platform': p[5]|trim, 'environment': p[6]|trim, 'ever_used': '0', 'last_used_date': 'NEVER'}) -%}
                {%- set inst_key = p[1]|trim ~ '|' ~ p[2]|trim -%}
                {%- if inst_key not in unique_instances -%}
                  {%- set _ = unique_instances.append(inst_key) -%}
                {%- endif -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set n = unique_instances | length -%}
          {%- set platforms = vopts | map(attribute='platform') | unique | list | sort -%}
          {%- set rows = [] -%}
          {%- for opt_name in ee_extra_options -%}
            {%- set opt_vopts = [] -%}
            {%- for o in vopts -%}
              {%- if o.name == opt_name or (o.name | upper) == (opt_name | upper) -%}
                {%- set _ = opt_vopts.append(o) -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if opt_vopts | length > 0 -%}
              {%- set en_tot = namespace(v=0) -%}{%- set iu_tot = namespace(v=0) -%}{%- set ev_tot = namespace(v=0) -%}
              {%- set en_list = [] -%}{%- set iu_list = [] -%}{%- set ev_list = [] -%}
              {%- for o in opt_vopts -%}
                {%- set inst_key = o.host ~ '|' ~ o.sid -%}
                {%- if (o.enabled | upper in ['TRUE', 'Y', '1']) and inst_key not in en_list -%}{%- set en_tot.v = en_tot.v + 1 -%}{%- set _ = en_list.append(inst_key) -%}{%- endif -%}
                {%- if (o.inuse | upper in ['Y', 'TRUE', '1']) and inst_key not in iu_list -%}{%- set iu_tot.v = iu_tot.v + 1 -%}{%- set _ = iu_list.append(inst_key) -%}{%- endif -%}
                {%- if (o.ever_used | string in ['1', 'Y', 'TRUE']) and inst_key not in ev_list -%}{%- set ev_tot.v = ev_tot.v + 1 -%}{%- set _ = ev_list.append(inst_key) -%}{%- endif -%}
              {%- endfor -%}
              {%- if iu_tot.v > 0 -%}{%- set risk = '!! RISK' -%}
              {%- elif en_tot.v > 0 and ev_tot.v > 0 -%}{%- set risk = '!! WARN' -%}
              {%- elif en_tot.v > 0 -%}{%- set risk = '~~ INFO' -%}
              {%- elif ev_tot.v > 0 -%}{%- set risk = '~~ CHK' -%}
              {%- else -%}{%- set risk = '' -%}{%- endif -%}
              {%- if risk != '' -%}
                {%- set _ = rows.append('') -%}
                {%- set _ = rows.append(risk ~ ' ' ~ opt_name ~ ' (enabled=' ~ en_tot.v ~ '/' ~ n ~ ' in-use=' ~ iu_tot.v ~ '/' ~ n ~ ' ever-used=' ~ ev_tot.v ~ ')') -%}
                {%- set _ = rows.append('-' * 130) -%}
                {%- for platform in platforms -%}
                  {%- set plat_instances = opt_vopts | selectattr('platform', 'equalto', platform) | list -%}
                  {%- if plat_instances | length > 0 -%}
                    {%- set _ = rows.append('  [' ~ platform ~ ']') -%}
                    {%- for o in plat_instances -%}
                      {%- if (o.enabled | upper in ['TRUE', 'Y', '1']) or (o.inuse | upper in ['Y', 'TRUE', '1']) or (o.ever_used | string in ['1', 'Y', 'TRUE']) -%}
                        {%- set _ = rows.append('    %-12s %-28s %-14s  enabled=%-5s  now=%-3s  ever=%-3s  last_seen=%-12s' | format('[' ~ o.environment ~ ']', o.host, o.sid, o.enabled, o.inuse, o.ever_used, o.last_used_date)) -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ rows | join(_nl) if rows | length > 0 else '  (no EE extra-cost options in-use or with historical usage)' }}

    # ── DEBUG: Show parsed option counts ───────────────────────────────────────
    - name: DEBUG - Show parsed voption counts per option  
      ansible.builtin.debug:
        msg:
          - "==== PARSED VOPTION DATA SUMMARY ===="
          - "EE table rows built: {{ (_rpt_ee_table | default('') | trim).split('\n') | length }}"
          - "Options with RISK or CHK flags:"
          - >-
            {%- set vopts = [] -%}
            {%- for line in (_voption_raw.stdout | default('') | trim).split('\n') -%}
              {%- if '|' in line -%}{%- set p = line.split('|') -%}
                {%- if p | length >= 7 -%}{%- set _ = vopts.append({'name': p[0]|trim, 'inuse': p[4]|trim | upper, 'enabled': p[3]|trim | upper}) -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set option_names = vopts | map(attribute='name') | unique | list | sort -%}
            {%- for opt in option_names -%}
              {%- set opt_instances = [] -%}
              {%- for v in vopts -%}
                {%- if v.name == opt or (v.name | upper) == (opt | upper) -%}
                  {%- set _ = opt_instances.append(v) -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set enabled_count = opt_instances | selectattr('enabled','in',['TRUE','Y','1']) | list | length -%}
              {%- set inuse_count = opt_instances | selectattr('inuse','in',['Y','TRUE','1']) | list | length -%}
              {{ opt }}: {{ enabled_count }} enabled, {{ inuse_count }} in-use
            {%- endfor -%}
          - "======================================"
      when: _voption_raw is defined

    # ── Fetch instance summary ─────────────────────────────────────────────────
    - name: Fetch instance rows from DB
      ansible.builtin.shell:
        cmd: |
          sqlplus -s /nolog << 'EOSQL'
          CONNECT {{ repo_user }}/"{{ repo_password }}"@{{ _repo_conn_string }}
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 LINESIZE 400 WRAP OFF TRIMSPOOL ON
          SELECT HOSTNAME || '|' ||
                 SID || '|' ||
                 NVL(ORACLE_VERSION,'') || '|' ||
                 NVL(IS_STANDBY,'N') || '|' ||
                 NVL(WAS_QUERIED,'Y') || '|' ||
                 NVL(SKIP_REASON,'') || '|' ||
                 NVL(DB_ROLE,'')
          FROM {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES
          WHERE RUN_ID IN ({{ _eff_run_id }})
          ORDER BY HOSTNAME, SID;
          EXIT;
          EOSQL
      register: _inst_raw
      changed_when: false

    - name: Build instance summary plain-text rows
      ansible.builtin.set_fact:
        _rpt_inst_rows: >-
          {%- set rows = [] -%}
          {%- for line in (_inst_raw.stdout | default('') | trim).split('\n') -%}
            {%- if '|' in line -%}
              {%- set p = line.split('|') -%}
              {%- if p | length >= 4 -%}
                {%- set hostname    = p[0]|trim -%}
                {%- set sid         = p[1]|trim -%}
                {%- set ver         = p[2]|trim -%}
                {%- set standby     = p[3]|trim -%}
                {%- set was_queried = p[4]|trim -%}
                {%- set skipreason  = p[5]|trim -%}
                {%- set role        = p[6]|trim -%}
                {%- if standby == 'Y' -%}{%- set status = 'STANDBY' -%}
                {%- elif was_queried == 'N' -%}{%- set status = 'SKIPPED' -%}
                {%- else -%}{%- set status = 'OK' -%}
                {%- endif -%}
                {%- set _ = rows.append('  %-30s %-12s %-20s %-12s %s' | format(
                    hostname, sid, ver, status, skipreason if was_queried == 'N' else role)) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ rows | join(_nl) }}

