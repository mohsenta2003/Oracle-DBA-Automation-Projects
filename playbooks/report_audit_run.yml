    - name: Fetch ADG per-instance VOPTION data (fallback for empty D_ADG)
      ansible.builtin.shell:
        cmd: |
          sqlplus -s /nolog << 'EOSQL'
          CONNECT {{ repo_user }}/"{{ repo_password }}"@{{ _repo_conn_string }}
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 LINESIZE 400 WRAP OFF TRIMSPOOL ON
          WITH host_latest_run AS (
            SELECT i.hostname, MAX(i.run_id) AS run_id
            FROM {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i
            WHERE i.run_id IN ({{ _eff_run_id }})
            GROUP BY i.hostname
          )
          SELECT v.HOSTNAME || '|' || v.SID || '|' ||
                 MAX(v.OPTION_ENABLED) || '|' ||
                 MAX(v.IS_INUSE) || '|' ||
                 MAX(i.ORACLE_VERSION) || '|' ||
                 MAX(i.DB_ROLE) AS result
          FROM {{ repo_schema | upper }}.ORACLE_OPT_VOPTION v
          JOIN host_latest_run hlr ON hlr.hostname = v.HOSTNAME AND hlr.run_id = v.RUN_ID
          JOIN {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i
            ON i.RUN_ID = v.RUN_ID AND i.HOSTNAME = v.HOSTNAME AND i.SID = v.SID
          WHERE v.OPTION_NAME = 'Active Data Guard'
          AND   (v.OPTION_ENABLED = 'TRUE' OR v.IS_INUSE = 'Y')
          GROUP BY v.HOSTNAME, v.SID
          ORDER BY MAX(v.IS_INUSE) DESC, v.HOSTNAME, v.SID;
          EXIT;
          EOSQL
      register: _adg_voption_raw
      changed_when: false

    - name: Fetch D_RAC rows from DB (only TRUE RAC with license option enabled)
      ansible.builtin.shell:
        cmd: |
          sqlplus -s /nolog << 'EOSQL'
          CONNECT {{ repo_user }}/"{{ repo_password }}"@{{ _repo_conn_string }}
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 LINESIZE 400 WRAP OFF TRIMSPOOL ON
          SELECT r.HOSTNAME || '|' || r.SID || '|' || NVL(TO_CHAR(r.RAC_INST_ID),'') || '|' ||
                 NVL(r.INSTANCE_NAME,'') || '|' || NVL(r.NODE_HOST,'') || '|' ||
                 NVL(r.STATUS,'')
          FROM {{ repo_schema | upper }}.ORACLE_OPT_D_RAC r
          WHERE r.RUN_ID IN ({{ _eff_run_id }})
          AND EXISTS (
              SELECT 1 FROM {{ repo_schema | upper }}.ORACLE_OPT_VOPTION v
              WHERE v.HOSTNAME = r.HOSTNAME 
              AND v.SID = r.SID
              AND v.RUN_ID IN ({{ _eff_run_id }})
              AND v.OPTION_NAME IN ('Real Application Clusters', 'Real Application Clusters One Node')
              AND v.OPTION_ENABLED = 'TRUE'
              AND v.IS_INUSE = 'Y'
          )
          AND (r.HOSTNAME, r.SID) IN (
              SELECT HOSTNAME, SID FROM {{ repo_schema | upper }}.ORACLE_OPT_D_RAC
              WHERE RUN_ID IN ({{ _eff_run_id }})
              GROUP BY HOSTNAME, SID HAVING COUNT(*) > 1
          )
          ORDER BY r.HOSTNAME, r.SID, r.RAC_INST_ID;
          EXIT;
          EOSQL
      register: _rac_raw
      changed_when: false

    # ── Build plain-text detail sections ──────────────────────────────────────
    - name: Build plain-text detail sections
      ansible.builtin.set_fact:
        _rpt_detail_part: >-
          {%- set rows = [] -%}
          {%- for line in (_part_raw.stdout | default('') | trim).split('\n') -%}
            {%- if '|' in line -%}
              {%- set p = line.split('|') -%}
              {%- if p | length >= 7 -%}
                {%- set _ = rows.append('  %-25s %-15s %-28s %-9s %-25s %5s %10s' | format(
                  (p[0]|trim ~ '/' ~ p[1]|trim)[:25], (p[2]|trim)[:15], (p[3]|trim)[:28],
                  (p[4]|trim)[:9], (p[5]|trim)[:25], p[6]|trim, p[7]|default('0')|trim)) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ rows | join(_nl) if rows | length > 0 else '  (no partitioned objects in this run)' }}
        _rpt_detail_compress: >-
          {%- set rows = [] -%}
          {%- for line in (_compress_raw.stdout | default('') | trim).split('\n') -%}
            {%- if '|' in line -%}
              {%- set p = line.split('|') -%}
              {%- if p | length >= 6 -%}
                {%- set _ = rows.append('  %-25s %-15s %-28s %-10s %-20s %10s' | format(
                  (p[0]|trim ~ '/' ~ p[1]|trim)[:25], (p[2]|trim)[:15], (p[3]|trim)[:28],
                  (p[4]|trim)[:10], (p[5]|trim)[:20], p[6]|default('0')|trim)) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ rows | join(_nl) if rows | length > 0 else '  (no Advanced Compression objects in this run)' }}
        _rpt_detail_security: >-
          {%- set rows = [] -%}
          {%- for line in (_security_raw.stdout | default('') | trim).split('\n') -%}
            {%- if '|' in line -%}
              {%- set p = line.split('|') -%}
              {%- if p | length >= 6 -%}
                {%- set _ = rows.append('  %-25s %-12s %-20s %-35s %-9s %s' | format(
                  (p[0]|trim ~ '/' ~ p[1]|trim)[:25], (p[2]|trim)[:12], (p[3]|trim)[:20],
                  (p[4]|trim)[:35], (p[5]|trim)[:9], p[6]|default('')|trim)) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ rows | join(_nl) if rows | length > 0 else '  (no TDE encrypted objects in this run)' }}
        _rpt_detail_inmem: >-
          {%- set rows = [] -%}
          {%- for line in (_inmem_raw.stdout | default('') | trim).split('\n') -%}
            {%- if '|' in line -%}
              {%- set p = line.split('|') -%}
              {%- if p | length >= 6 -%}
                {%- set _ = rows.append('  %-25s %-15s %-28s %-15s %-20s %10s' | format(
                  (p[0]|trim ~ '/' ~ p[1]|trim)[:25], (p[2]|trim)[:15], (p[3]|trim)[:28],
                  (p[4]|trim)[:15], (p[5]|trim)[:20], p[6]|default('0')|trim)) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ rows | join(_nl) if rows | length > 0 else '  (no In-Memory tables in this run)' }}
        _rpt_detail_pdb: >-
          {%- set rows = [] -%}
          {%- for line in (_pdb_raw.stdout | default('') | trim).split('\n') -%}
            {%- if '|' in line -%}
              {%- set p = line.split('|') -%}
              {%- if p | length >= 6 -%}
                {%- set _ = rows.append('  %-25s %6s %-20s %-12s %-4s %s' | format(
                  (p[0]|trim ~ '/' ~ p[1]|trim)[:25], p[2]|trim,
                  (p[3]|trim)[:20], (p[4]|trim)[:12], (p[5]|trim)[:4], p[6]|default('')|trim)) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ rows | join(_nl) if rows | length > 0 else '  (no PDBs in this run — all instances are non-CDB)' }}
        _rpt_detail_adg: >-
          {%- set rows = [] -%}
          {%- for line in (_adg_raw.stdout | default('') | trim).split('\n') -%}
            {%- if '|' in line -%}
              {%- set p = line.split('|') -%}
              {%- if p | length >= 6 -%}
                {%- set _ = rows.append('  %-25s %-25s %-12s %-12s %-20s %s' | format(
                  (p[0]|trim ~ '/' ~ p[1]|trim)[:25], (p[2]|trim)[:25], (p[3]|trim)[:12],
                  (p[4]|trim)[:12], (p[5]|trim)[:20], p[6]|default('')|trim)) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ rows | join(_nl) if rows | length > 0 else '  (no Active Data Guard configuration in this run)' }}
        _rpt_detail_rac: >-
          {%- set rows = [] -%}
          {%- for line in (_rac_raw.stdout | default('') | trim).split('\n') -%}
            {%- if '|' in line -%}
              {%- set p = line.split('|') -%}
              {%- if p | length >= 5 -%}
                {%- set _ = rows.append('  %-25s %6s %-20s %-25s %s' | format(
                  (p[0]|trim ~ '/' ~ p[1]|trim)[:25], p[2]|trim,
                  (p[3]|trim)[:20], (p[4]|trim)[:25], p[5]|default('')|trim)) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ rows | join(_nl) if rows | length > 0 else '  (no RAC nodes in this run)' }}

    # ── Assemble and print plain-text report ──────────────────────────────────
    - name: Assemble full plain-text report
      ansible.builtin.set_fact:
        _full_report: |
          ╔════════════════════════════════════════════════════════════════════════════════╗
          ║                 ORACLE LICENSE OPTIONS AUDIT REPORT                            ║
          ╚════════════════════════════════════════════════════════════════════════════════╝
          
          ┌─ REPORT METADATA ─────────────────────────────────────────────────────────────┐
          │ Audit Cycles      : {{ _rpt_label }}
          │ Reference         : {{ _rpt_run_id }}
          │ Data Collected    : {{ _rpt_date }}
          │ Report Generated  : {{ _report_timestamp | replace('_', ' ') | replace('-', ':', 2) }}
          │ Generated by      : {{ lookup('pipe','whoami') }}@{{ lookup('pipe','hostname') }}
          │ Repository        : {{ repo_host }}:{{ repo_port }}/{{ repo_sid }}
          └───────────────────────────────────────────────────────────────────────────────┘
          
          ┌─ INFRASTRUCTURE SUMMARY ──────────────────────────────────────────────────────┐
          │ Total Hosts       : {{ _rpt_hosts }}
          │ Total Instances   : {{ _rpt_queried }}
          │ Standby Instances : {{ _rpt_standby }}
          │ Skipped/Errors    : {{ _rpt_skipped }}
          └───────────────────────────────────────────────────────────────────────────────┘
          {%- if _report_mode == 'all_hosts' and _all_hosts_status_raw is defined -%}
          {{ '' }}
          ┌─ LICENSE RISK OVERVIEW BY ENVIRONMENT ────────────────────────────────────────┐
          {%- set host_data = [] -%}
          {%- for line in (_all_hosts_status_raw.stdout | default('') | trim).split('\n') -%}
          {%- if '|' in line -%}
          {%- set parts = line.split('|') -%}
          {%- if parts | length >= 9 -%}
          {%- set _ = host_data.append({
              'platform': parts[0]|trim,
              'environment': parts[1]|trim,
              'hostname': parts[3]|trim,
              'instances': parts[6]|trim,
              'licenses': parts[8]|trim
          }) -%}
          {%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set prod_hosts = host_data | selectattr('environment', 'equalto', 'Production') | list -%}
          {%- set model_hosts = host_data | selectattr('environment', 'equalto', 'Model') | list -%}
          {%- set test_hosts = host_data | selectattr('environment', 'equalto', 'Test-Dev') | list -%}
          {%- set prod_with_lic = prod_hosts | selectattr('licenses', 'ne', 'None') | list -%}
          {%- set model_with_lic = model_hosts | selectattr('licenses', 'ne', 'None') | list -%}
          {%- set test_with_lic = test_hosts | selectattr('licenses', 'ne', 'None') | list -%}
          {{ '' }}│ 🔴 PRODUCTION       : {{ prod_hosts | length }} hosts ({{ prod_with_lic | length }} using licensed options)
          │ 🟠 MODEL            : {{ model_hosts | length }} hosts ({{ model_with_lic | length }} using licensed options)
          │ 🟢 TEST/DEV         : {{ test_hosts | length }} hosts ({{ test_with_lic | length }} using licensed options)
          └───────────────────────────────────────────────────────────────────────────────┘
          {%- endif -%}
          
          ╔════════════════════════════════════════════════════════════════════════════════╗
          ║                        LICENSE RISK ASSESSMENT                                 ║
          ╚════════════════════════════════════════════════════════════════════════════════╝
          
          ┌─ FIELD LEGEND ────────────────────────────────────────────────────────────────┐
          │ enabled  → Is the option CONFIGURED in database? (v$option = TRUE/FALSE)
          │ now      → Is it IN-USE right now? (current audit cycle)
          │ ever     → Was it EVER used? (⚠️  Oracle licenses are PERPETUAL - if ever=1,
          │            you owe Oracle money even if you later disabled it!)
          │ last_seen→ Last DATE when this option was actively used in production
          └───────────────────────────────────────────────────────────────────────────────┘
          
          {{ _rpt_ee_table }}
          
          ┌─ RISK LEVEL KEY ──────────────────────────────────────────────────────────────┐
          │ !! RISK  → Option IN-USE NOW (current audit) → 🔴 ACTIVE LICENSE EXPOSURE
          │ !! WARN  → Enabled + Historical use only → 🟠 PAST USAGE (Oracle may still bill)
          │ ~~ INFO  → Enabled but NEVER used → 🟡 POTENTIAL FUTURE RISK
          │ ~~ CHK   → Disabled but has historical usage → ⚠️  VERIFY COMPLIANCE
          │
          │ NOTE: All enabled instances shown below (even if never used)
          └───────────────────────────────────────────────────────────────────────────────┘
          {%- if _report_mode == 'all_hosts' and _all_hosts_status_raw is defined -%}
          {{ '' }}
          ╔════════════════════════════════════════════════════════════════════════════════╗
          ║                    HOSTS WITH LICENSED OPTIONS IN-USE                          ║
          ╚════════════════════════════════════════════════════════════════════════════════╝
          {%- set host_data = [] -%}
          {%- for line in (_all_hosts_status_raw.stdout | default('') | trim).split('\n') -%}
          {%- if '|' in line -%}
          {%- set parts = line.split('|') -%}
          {%- if parts | length >= 9 -%}
          {%- set _ = host_data.append({
              'platform': parts[0]|trim,
              'environment': parts[1]|trim,
              'hostname': parts[3]|trim,
              'run_id': parts[4]|trim,
              'instances': parts[6]|trim,
              'standby': parts[7]|trim,
              'licenses': parts[8]|trim
          }) -%}
          {%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set environments = ['Production', 'Model', 'Test-Dev'] -%}
          {%- for env in environments -%}
          {%- set env_hosts = host_data | selectattr('environment', 'equalto', env) | selectattr('licenses', 'ne', 'None') | list -%}
          {%- if env_hosts | length > 0 -%}
          {{ '' }}
          ┌─ {{ env.upper() }} ENVIRONMENT ─────────────────────────────────────────────────
          │ Hosts with licensed options: {{ env_hosts | length }}
          {%- for host in env_hosts %}
          │ • {{ host.hostname.ljust(30) }} [{{ host.platform.ljust(9) }}] {{ host.instances }} inst  → {{ host.licenses[:70] }}
          {%- endfor %}
          └─────────────────────────────────────────────────────────────────────────────────
          {%- endif -%}
          {%- endfor -%}
          {%- endif -%}
          
          ╔════════════════════════════════════════════════════════════════════════════════╗
          ║                         DETAILED EVIDENCE                                      ║
          ╚════════════════════════════════════════════════════════════════════════════════╝
          {%- set has_evidence = false %}
          {%- if _rpt_detail_part is defined and _rpt_detail_part | trim != '(no data)' and '  (no partitioned tables' not in _rpt_detail_part %}
          {%- set has_evidence = true %}
          
          ┌─ PARTITIONING ────────────────────────────────────────────────────────────────┐
          {{ _rpt_detail_part }}
          └───────────────────────────────────────────────────────────────────────────────┘
          {%- endif %}
          {%- if _rpt_detail_compress is defined and _rpt_detail_compress | trim != '(no data)' and '  (no compressed' not in _rpt_detail_compress %}
          {%- set has_evidence = true %}
          
          ┌─ ADVANCED COMPRESSION ────────────────────────────────────────────────────────┐
          {{ _rpt_detail_compress }}
          └───────────────────────────────────────────────────────────────────────────────┘
          {%- endif %}
          {%- if _rpt_detail_security is defined and _rpt_detail_security | trim != '(no data)' and '  (no encrypted' not in _rpt_detail_security %}
          {%- set has_evidence = true %}
          
          ┌─ ADVANCED SECURITY (TDE) ─────────────────────────────────────────────────────┐
          {{ _rpt_detail_security }}
          └───────────────────────────────────────────────────────────────────────────────┘
          {%- endif %}
          {%- if _rpt_detail_inmem is defined and _rpt_detail_inmem | trim != '(no data)' and '  (no In-Memory' not in _rpt_detail_inmem %}
          {%- set has_evidence = true %}
          
          ┌─ IN-MEMORY COLUMN STORE ──────────────────────────────────────────────────────┐
          {{ _rpt_detail_inmem }}
          └───────────────────────────────────────────────────────────────────────────────┘
          {%- endif %}
          {%- if _rpt_detail_adg is defined and _rpt_detail_adg | trim != '(no data)' and '  (no Active Data Guard' not in _rpt_detail_adg %}
          {%- set has_evidence = true %}
          
          ┌─ ACTIVE DATA GUARD ───────────────────────────────────────────────────────────┐
          {{ _rpt_detail_adg }}
          └───────────────────────────────────────────────────────────────────────────────┘
          {%- endif %}
          {%- if _rpt_detail_rac is defined and _rpt_detail_rac | trim != '(no data)' and '  (no RAC nodes' not in _rpt_detail_rac %}
          {%- set has_evidence = true %}
          
          ┌─ REAL APPLICATION CLUSTERS (RAC) ─────────────────────────────────────────────┐
          │ NOTE: Shows only databases with "Real Application Clusters" license option   │
          │       ENABLED & IN-USE. Grid Infrastructure HA clusters (without RAC license) │
          │       are NOT included. RAC requires active multi-instance simultaneous access│
          └───────────────────────────────────────────────────────────────────────────────┘
          {{ _rpt_detail_rac }}
          └───────────────────────────────────────────────────────────────────────────────┘
          {%- endif %}
          {%- if not has_evidence %}
          
          ┌───────────────────────────────────────────────────────────────────────────────┐
          │ No detailed evidence data available for this report run.
          └───────────────────────────────────────────────────────────────────────────────┘
          {%- endif %}
          
          ═══════════════════════════════════════════════════════════════════════════════════
          Report generated by Oracle DBA Automation Framework
          Data source: {{ repo_schema | upper }} schema on {{ repo_host }}:{{ repo_port }}/{{ repo_sid }}
          ═══════════════════════════════════════════════════════════════════════════════════
          

    - name: Print report to console
      ansible.builtin.debug:
        msg: "{{ _full_report.split('\n') }}"

    # ── Build HTML email ───────────────────────────────────────────────────────
