    # In-Memory fallback: per-instance status from VOPTION when D_INMEM is empty
    - name: Fetch In-Memory per-instance VOPTION data (fallback for empty D_INMEM)
      ansible.builtin.shell:
        cmd: |
          sqlplus -s /nolog << 'EOSQL'
          CONNECT {{ repo_user }}/"{{ repo_password }}"@{{ _repo_conn_string }}
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 LINESIZE 400 WRAP OFF TRIMSPOOL ON
          WITH host_latest_run AS (
            SELECT i.hostname, MAX(i.run_id) AS run_id
            FROM {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i
            WHERE i.run_id IN ({{ _eff_run_id }})
            GROUP BY i.hostname
          )
          SELECT v.HOSTNAME || '|' || v.SID || '|' ||
                 MAX(v.OPTION_ENABLED) || '|' ||
                 MAX(v.IS_INUSE) || '|' ||
                 MAX(i.ORACLE_VERSION) || '|' ||
                 MAX(i.DB_ROLE) AS result
          FROM {{ repo_schema | upper }}.ORACLE_OPT_VOPTION v
          JOIN host_latest_run hlr ON hlr.hostname = v.HOSTNAME AND hlr.run_id = v.RUN_ID
          JOIN {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i
            ON i.RUN_ID = v.RUN_ID AND i.HOSTNAME = v.HOSTNAME AND i.SID = v.SID
          WHERE v.OPTION_NAME = 'In-Memory Column Store'
          AND   (v.OPTION_ENABLED = 'TRUE' OR v.IS_INUSE = 'Y')
          GROUP BY v.HOSTNAME, v.SID
          ORDER BY MAX(v.IS_INUSE) DESC, v.HOSTNAME, v.SID;
          EXIT;
          EOSQL
