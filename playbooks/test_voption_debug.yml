---
- name: Test voption query DEBUG only
  hosts: localhost
  connection: local
  gather_facts: false
  become: no
  
  vars_files:
    - ../vars/repo_config.yml
  
  vars:
    _eff_run_id: "81,101,121"
    _report_mode: "all_hosts"
  
  tasks:
    - name: Fetch voption rows from DB (all hosts mode - per-host latest)
      ansible.builtin.shell:
        cmd: |
          sqlplus -s /nolog << 'EOSQL'
          CONNECT {{ repo_user }}/"{{ repo_password }}"@{{ _repo_conn_string }}
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 LINESIZE 500 WRAP OFF TRIMSPOOL ON
          WITH host_latest_run AS (
            SELECT i.hostname, MAX(i.run_id) AS run_id
            FROM {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i
            WHERE i.run_id IN ({{ _eff_run_id }})
            GROUP BY i.hostname
          ),
          historical_usage AS (
            SELECT 
              vh.hostname,
              vh.sid,
              vh.option_name,
              MAX(CASE WHEN vh.is_inuse = 'Y' THEN 1 ELSE 0 END) AS ever_used,
              MAX(CASE WHEN vh.is_inuse = 'Y' THEN vh.run_id END) AS last_used_run
            FROM {{ repo_schema | upper }}.ORACLE_OPT_VOPTION vh
            WHERE vh.is_ee_extra = 'Y'
            GROUP BY vh.hostname, vh.sid, vh.option_name
          ),
          voption_with_instance AS (
            SELECT 
              v.option_name,
              v.hostname,
              v.sid,
              v.option_enabled,
              v.is_inuse,
              v.run_id,
              i.os_type,
              i.region
            FROM {{ repo_schema | upper }}.ORACLE_OPT_VOPTION v
            JOIN host_latest_run hlr ON hlr.hostname = v.hostname AND hlr.run_id = v.run_id
            JOIN {{ repo_schema | upper }}.ORACLE_OPT_INSTANCES i ON i.hostname = hlr.hostname AND i.run_id = hlr.run_id AND i.sid = v.sid
            WHERE v.is_ee_extra = 'Y'
          )
          SELECT 
            vi.option_name || '|' ||
            vi.hostname || '|' ||
            vi.sid || '|' ||
            vi.option_enabled || '|' ||
            vi.is_inuse || '|' ||
            CASE
              WHEN UPPER(vi.os_type) = 'AIX' THEN 'AIX'
              WHEN UPPER(vi.os_type) LIKE '%LINUX%' AND UPPER(vi.region) LIKE '%EU%' THEN 'EU-Linux'
              WHEN UPPER(vi.os_type) LIKE '%LINUX%' THEN 'US-Linux'
              ELSE 'Other'
            END || '|' ||
            CASE
              WHEN UPPER(vi.hostname) LIKE 'CRLNXP%' OR UPPER(vi.hostname) LIKE 'UKLNXP%' 
                   OR UPPER(vi.hostname) LIKE 'UKAIXP%' OR UPPER(vi.hostname) LIKE 'DCUP%' 
                   OR UPPER(vi.hostname) LIKE 'CRANXP%' OR UPPER(vi.hostname) LIKE 'IP-%' THEN 'Production'
              WHEN UPPER(vi.hostname) LIKE 'CRLNXM%' THEN 'Model'
              WHEN UPPER(vi.hostname) LIKE 'CRLNXT%' OR UPPER(vi.hostname) LIKE 'CRLNXD%' 
                   OR UPPER(vi.hostname) LIKE 'UKLNXT%' OR UPPER(vi.hostname) LIKE 'UKAIXT%' 
                   OR UPPER(vi.hostname) LIKE 'DCUNX%' THEN 'Test-Dev'
              ELSE 'Other'
            END || '|' ||
            NVL(TO_CHAR(h.ever_used), '0') || '|' ||
            NVL(TO_CHAR(h.last_used_run), 'NEVER') AS result
          FROM voption_with_instance vi
          LEFT JOIN historical_usage h ON h.hostname = vi.hostname AND h.sid = vi.sid AND h.option_name = vi.option_name
          ORDER BY vi.option_name, vi.is_inuse DESC, h.ever_used DESC, vi.hostname, vi.sid;
          EXIT;
          EOSQL
      register: _voption_raw
      changed_when: false
      become: false

    - name: "==== VOPTION RAW QUERY DIAGNOSTICS ===="
      ansible.builtin.debug:
        msg:
          - "==== VOPTION RAW QUERY DIAGNOSTICS ===="
          - "Query executed: {{ 'all_hosts' if _report_mode == 'all_hosts' else 'specific_run' }} mode"
          - "Effective RUN_ID(s): {{ _eff_run_id }}"
          - "Stdout defined: {{ _voption_raw.stdout is defined }}"
          - "Stdout length: {{ (_voption_raw.stdout | default('') | length) }} characters"
          - "Line count: {{ (_voption_raw.stdout | default('') | trim).split('\n') | length }}"
          - "First 5 lines of data:"
          - "{{ (_voption_raw.stdout | default('NO DATA') | trim).split('\n')[:5] | join('\n  ') }}"
          - "======================================="
