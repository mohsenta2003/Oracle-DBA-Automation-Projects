---
# Setup cron configuration for continuous log sync
# NOTE: This task does NOT auto-configure crontab.
#       It deploys the sync script to the target host and
#       outputs the recommended crontab entries for you to
#       manually add to your CONTROL NODE's crontab.
#

  - name: Ensure script and log directories exist
    ansible.builtin.file:
      path: "{{ oracle_script_path }}"
      state: directory
      mode: '0755'

  - name: Deploy sync script to target host
    ansible.builtin.copy:
      dest: "{{ oracle_script_path }}/oracle_log_sync.sh"
      mode: '0755'
      content: |
        #!/bin/bash
        # Oracle Log Sync Script - Auto-generated by Ansible
        # Platform: AIX
        
        LOG_FILE="{{ oracle_sync_log }}"
        NFS_PATH="{{ nfs_log_path }}"
        HOSTNAME="{{ inventory_hostname }}"
        SHORT_HOSTNAME=$(hostname | cut -d'.' -f1)
        
        # Ensure log file exists and is writable
        touch $LOG_FILE 2>/dev/null
        
        # Load Oracle user environment (needed for cron execution)
        if [ -f ~/.profile ]; then
          . ~/.profile > /dev/null 2>&1
        fi
        
        echo "$(date '+%Y-%m-%d %H:%M:%S') - Starting Oracle log sync" >> $LOG_FILE
        
        # Check NFS mount
        if ! df -g "$NFS_PATH" > /dev/null 2>&1; then
          echo "$(date '+%Y-%m-%d %H:%M:%S') - ERROR: NFS path $NFS_PATH not mounted" >> $LOG_FILE
          exit 1
        fi
        
        # Detect Oracle user (from first ora_pmon)
        ORACLE_USER=$(ps -eo user,args | grep 'ora_pmon_' | grep -v grep | head -1 | awk '{print $1}')
        
        if [ -z "$ORACLE_USER" ]; then
          echo "$(date '+%Y-%m-%d %H:%M:%S') - ERROR: Could not detect Oracle user" >> $LOG_FILE
          exit 1
        fi
        
        # Get all running instances
        INSTANCES=$(ps -ef | grep 'ora_pmon_' | grep -v grep | sed 's/.*ora_pmon_//' | awk '{print $1}')
        
        # Skip instances (MGMTDB, ASM)
        SKIP_LIST="{{ skip_instances | join('|') }}"
        
        for SID in $INSTANCES; do
          if [[ -n "$SKIP_LIST" ]] && echo "$SID" | grep -qE "$SKIP_LIST"; then
            echo "$(date '+%Y-%m-%d %H:%M:%S') - Skipping instance: $SID (in skip list)" >> $LOG_FILE
            continue
          fi
          
          echo "$(date '+%Y-%m-%d %H:%M:%S') - Processing instance: $SID" >> $LOG_FILE
          
          # Get ORACLE_HOME from oratab
          ORACLE_HOME=$(grep "^${SID}:" /etc/oratab | cut -d':' -f2)
          
          if [ -z "$ORACLE_HOME" ]; then
            echo "$(date '+%Y-%m-%d %H:%M:%S') - WARNING: No ORACLE_HOME for $SID in /etc/oratab" >> $LOG_FILE
            continue
          fi
          
          # Primary: Get Diag Trace from SQLPlus
          DIAG_TRACE=$($ORACLE_HOME/bin/sqlplus -s / as sysdba <<EOF
SET HEADING OFF
SET FEEDBACK OFF
SELECT value FROM v\$diag_info WHERE name = 'Diag Trace';
EXIT;
EOF
          )
          DIAG_TRACE=$(echo "$DIAG_TRACE" | grep -E '^/' | head -1 | tr -d '[:space:]')
          
          # Fallback: Get Diag Trace via adrci if SQLPlus failed
          if [[ -z "$DIAG_TRACE" ]]; then
            DIAG_TRACE=$(export PATH=$ORACLE_HOME/bin:$PATH; adrci exec="show homes" | grep -i "rdbms/$(echo $SID | tr '[:upper:]' '[:lower:]')/$SID" | head -1 | tr -d '[:space:]')
            if [ -n "$DIAG_TRACE" ]; then
              ADR_BASE=$(export PATH=$ORACLE_HOME/bin:$PATH; adrci exec="show base" | grep "ADR base is" | awk '{print $4}' | tr -d '"')
              DIAG_TRACE="$ADR_BASE/$DIAG_TRACE/trace"
            fi
          fi
          
          # Get Audit Dest
          AUDIT_DEST=$($ORACLE_HOME/bin/sqlplus -s / as sysdba <<EOF
SET HEADING OFF
SET FEEDBACK OFF
SELECT value FROM v\$parameter WHERE name = 'audit_file_dest';
EXIT;
EOF
          )
          AUDIT_DEST=$(echo "$AUDIT_DEST" | grep -E '^/' | head -1 | tr -d '[:space:]')
          
          {% if sync_alert_logs | bool %}
          # Sync alert/trace logs
          if [ -n "$DIAG_TRACE" ] && [ -d "$DIAG_TRACE" ]; then
            mkdir -p "$NFS_PATH/$HOSTNAME/$SID/alert" 2>/dev/null
            rsync -avz --update --include='alert_*.log' --include='alert_*.xml' --exclude='*' \
              "$DIAG_TRACE/" "$NFS_PATH/$HOSTNAME/$SID/alert/" >> $LOG_FILE 2>&1
          else
            echo "$(date '+%Y-%m-%d %H:%M:%S') - WARNING: Trace dir not found for $SID" >> $LOG_FILE
          fi
          {% endif %}
          
          {% if sync_audit_logs | bool %}
          # Sync audit logs
          if [ -n "$AUDIT_DEST" ] && [ -d "$AUDIT_DEST" ]; then
            mkdir -p "$NFS_PATH/$HOSTNAME/$SID/audit" 2>/dev/null
            rsync -avz --update --include='*.aud' --include='*.xml' --exclude='*' \
              "$AUDIT_DEST/" "$NFS_PATH/$HOSTNAME/$SID/audit/" >> $LOG_FILE 2>&1
          else
            echo "$(date '+%Y-%m-%d %H:%M:%S') - WARNING: Audit dir not found for $SID" >> $LOG_FILE
          fi
          {% endif %}
        done
        
        {% if sync_listener_logs | bool %}
        # Detect Listeners
        LISTENERS=$(ps -ef | grep tnslsnr | grep -v grep | grep -v MGMTLSNR | while read line; do
          owner=$(echo "$line" | awk '{print $1}')
          if [ "$owner" = "$ORACLE_USER" ]; then
            lsnr_name=$(echo "$line" | sed 's/.*tnslsnr //' | awk '{print $1}')
            if [ "$lsnr_name" != "LISTENER" ]; then
              echo "$lsnr_name"
            fi
          fi
        done | sort -u)
        
        for LSNR in $LISTENERS; do
          echo "$(date '+%Y-%m-%d %H:%M:%S') - Processing listener: $LSNR" >> $LOG_FILE
          LSNR_DIR=""
          
          # Primary: Multi-path search (known correct method)
          ORACLE_BASE_TMP=$(grep -v '^#' /etc/oratab | grep ':' | head -1 | awk -F':' '{print $2}' | sed 's|/product.*||')
          LSNR_LOWER=$(echo "$LSNR" | tr '[:upper:]' '[:lower:]')
          
          for TEST_DIR in \
            "${ORACLE_BASE_TMP}/diag/tnslsnr/${SHORT_HOSTNAME}/${LSNR_LOWER}/trace" \
            "${ORACLE_BASE_TMP}/diag/tnslsnr/${SHORT_HOSTNAME}/${LSNR}/trace" \
            "/u01/mod/oracle/diag/tnslsnr/${SHORT_HOSTNAME}/${LSNR_LOWER}/trace"; do
            if [ -d "$TEST_DIR" ]; then
              LSNR_DIR="$TEST_DIR"
              break
            fi
          done
          
          # Fallback: via adrci
          if [ -z "$LSNR_DIR" ]; then
            LSNR_PATH=$(export PATH=$ORACLE_HOME/bin:$PATH; adrci exec='show homes' 2>/dev/null | grep -i "tnslsnr.*$LSNR" | head -1 | tr -d '[:space:]')
            if [ -n "$LSNR_PATH" ]; then
              ADR_BASE_LSNR=$(export PATH=$ORACLE_HOME/bin:$PATH; adrci exec='show base' 2>/dev/null | grep 'ADR base is' | awk '{print $4}' | tr -d '"')
              LSNR_DIR="$ADR_BASE_LSNR/$LSNR_PATH/trace"
            fi
          fi
          
          if [[ -n "$LSNR_DIR" && -d "$LSNR_DIR" ]]; then
            mkdir -p "$NFS_PATH/$HOSTNAME/listener/$LSNR" 2>/dev/null
            rsync -avz --update --include='*.log' --include='*.xml' --exclude='*' \
              "$LSNR_DIR/" "$NFS_PATH/$HOSTNAME/listener/$LSNR/" >> $LOG_FILE 2>&1
          else
            echo "$(date '+%Y-%m-%d %H:%M:%S') - WARNING: Log dir not found for listener $LSNR" >> $LOG_FILE
          fi
        done
        {% endif %}
        
        {% if log_retention_days > 0 %}
        # Cleanup old logs on NFS
        find "$NFS_PATH/$HOSTNAME" -type f -mtime +{{ log_retention_days }} -delete 2>/dev/null
        {% endif %}
        
        {% if compress_logs %}
        # Compress logs older than 1 day
        find "$NFS_PATH/$HOSTNAME" -type f \( -name "*.log" -o -name "*.trc" -o -name "*.aud" \) -mtime +1 ! -name "*.gz" -exec gzip {} \; 2>/dev/null
        {% endif %}
        
        echo "$(date '+%Y-%m-%d %H:%M:%S') - Oracle log sync completed" >> $LOG_FILE

  # ============================================
  # Output: Recommended Crontab Entries
  # ============================================
  # NOTE: These are NOT auto-installed.
  #       Copy the lines below and add them to
  #       your control node's crontab manually.
  # ============================================

  - name: "Display recommended crontab configuration"
    ansible.builtin.debug:
      msg: |
        ╔════════════════════════════════════════════════════════════════════════╗
        ║           RECOMMENDED CRONTAB ENTRIES (Control Node)                 ║
        ╠════════════════════════════════════════════════════════════════════════╣
        ║                                                                      ║
        ║  Add the following lines to your CONTROL NODE crontab:               ║
        ║  (Run: crontab -e)                                                   ║
        ║                                                                      ║
        ╠════════════════════════════════════════════════════════════════════════╣
        ║  Option A: Sync Only (Fast, every {{ cron_interval }} min)                            ║
        ╚════════════════════════════════════════════════════════════════════════╝
        
        */{{ cron_interval }} * * * * cd {{ playbook_dir }}/.. && ansible-playbook playbooks/sync_oracle_logs.yml -e "job_type=sync_only" -l {{ inventory_hostname }} >> /tmp/oracle_sync_cron.log 2>&1
        
        ╔════════════════════════════════════════════════════════════════════════╗
        ║  Option B: Full Run with Reports (Hourly/Daily)                      ║
        ╚════════════════════════════════════════════════════════════════════════╝
        
        0 * * * * cd {{ playbook_dir }}/.. && ansible-playbook playbooks/sync_oracle_logs.yml -e "job_type=full" -l {{ inventory_hostname }} >> /tmp/oracle_sync_cron.log 2>&1
        
        ╔════════════════════════════════════════════════════════════════════════╗
        ║  Option C: Combined (Sync every {{ cron_interval }} min + Report hourly)              ║
        ╚════════════════════════════════════════════════════════════════════════╝
        
        */{{ cron_interval }} * * * * cd {{ playbook_dir }}/.. && ansible-playbook playbooks/sync_oracle_logs.yml -e "job_type=sync_only" -l {{ inventory_hostname }} >> /tmp/oracle_sync_cron.log 2>&1
        0 * * * *   cd {{ playbook_dir }}/.. && ansible-playbook playbooks/sync_oracle_logs.yml -e "job_type=report_only" -l {{ inventory_hostname }} >> /tmp/oracle_sync_cron.log 2>&1
        
        ════════════════════════════════════════════════════════════════════════
        Script deployed to target: {{ oracle_script_path }}/oracle_log_sync.sh
        Sync log location:         {{ oracle_sync_log }}
        NFS destination:           {{ nfs_log_path }}/{{ inventory_hostname }}
        ════════════════════════════════════════════════════════════════════════
