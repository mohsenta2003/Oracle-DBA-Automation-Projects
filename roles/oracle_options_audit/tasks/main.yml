      port:    "{{ smtp_port }}"
      from:    "{{ email_from }}"
      to:      "{{ email_to }}"
      subject: "[Oracle License Audit] EE Options & Features Report - {{ _audit_date }} | Run #{{ _audit_run_id }} | {{ run_label }}"
      body: |
        =========================================================================
         ORACLE OPTIONS & FEATURES AUDIT - RUN SUMMARY
        =========================================================================
         Run ID       : {{ _audit_run_id }}
         Label        : {{ run_label }}
