        -------------------------------------------------------------------------
          {{ 'HOSTNAME'.ljust(30) }} {{ 'SID'.ljust(12) }} {{ 'VERSION'.ljust(20) }} {{ 'STATUS'.ljust(12) }} ROLE
          {{ '-' * 90 }}
        {{ _email_inst_rows }}

        =========================================================================
