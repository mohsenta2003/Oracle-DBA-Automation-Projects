                   ORACLE_OPT_D_SECURITY, ORACLE_OPT_D_INMEM, ORACLE_OPT_D_PDB,
                   ORACLE_OPT_D_ADG, ORACLE_OPT_D_RAC
        =========================================================================
        This is an automated message from Ansible DBA Automation.
    delegate_to: localhost
    become: no
    run_once: true
    when: send_summary_email | bool
