         Standby instances  : {{ _sum_standby }}
         Skipped / errors   : {{ _sum_skipped }}

        -------------------------------------------------------------------------
         EE EXTRA-COST OPTIONS - LICENSE RISK SUMMARY
        -------------------------------------------------------------------------
        {{ _email_ee_table }}

         RISK KEY:
           !! RISK  = enabled in v$option AND in-use -- LICENSE EXPOSURE
           ~~ CHK   = feature usage detected but v$option=FALSE -- verify
           (enabled-only = no risk; Oracle EE installs all options by default)

        {% if collect_partitioning | default(true) | bool %}{% if not (email_skip_empty_sections | default(false) | bool) or 'no partitioned' not in _email_detail_part %}
        -------------------------------------------------------------------------
         PARTITIONING - OBJECT LIST [ORACLE_OPT_D_PART, RUN_ID={{ _audit_run_id }}]
        -------------------------------------------------------------------------
          HOST/SID                  OWNER           TABLE                        TYPE      PART_KEY                  PARTS    SIZE_GB
          {{ '-' * 118 }}
        {{ _email_detail_part }}
        {% endif %}{% endif %}
        {% if collect_compression | default(true) | bool %}{% if not (email_skip_empty_sections | default(false) | bool) or 'no Advanced' not in _email_detail_compress %}
        -------------------------------------------------------------------------
         ADVANCED COMPRESSION - OBJECT LIST [ORACLE_OPT_D_COMPRESS, RUN_ID={{ _audit_run_id }}]
        -------------------------------------------------------------------------
          HOST/SID                  OWNER           OBJECT                       TYPE       COMPRESS_FOR              SIZE_GB
          {{ '-' * 118 }}
        {{ _email_detail_compress }}
        {% endif %}{% endif %}
        {% if collect_security | default(true) | bool %}{% if not (email_skip_empty_sections | default(false) | bool) or 'no TDE' not in _email_detail_security %}
        -------------------------------------------------------------------------
         ADVANCED SECURITY / TDE - OBJECT LIST [ORACLE_OPT_D_SECURITY, RUN_ID={{ _audit_run_id }}]
        -------------------------------------------------------------------------
          HOST/SID                  TYPE         OWNER/TS             OBJECT                              ENC       ALGORITHM
          {{ '-' * 118 }}
        {{ _email_detail_security }}
        {% endif %}{% endif %}
        {% if collect_inmemory | default(true) | bool %}{% if not (email_skip_empty_sections | default(false) | bool) or 'no In-Memory' not in _email_detail_inmem %}
        -------------------------------------------------------------------------
         IN-MEMORY DATABASE - OBJECT LIST [ORACLE_OPT_D_INMEM, RUN_ID={{ _audit_run_id }}]
        -------------------------------------------------------------------------
          HOST/SID                  OWNER           TABLE                        PRIORITY        COMPRESSION          SIZE_GB
          {{ '-' * 118 }}
        {{ _email_detail_inmem }}
        {% endif %}{% endif %}
        {% if collect_pdbs | default(true) | bool %}{% if not (email_skip_empty_sections | default(false) | bool) or 'no PDBs' not in _email_detail_pdb %}
        -------------------------------------------------------------------------
         MULTITENANT / PDB LIST [ORACLE_OPT_D_PDB, RUN_ID={{ _audit_run_id }}]
        -------------------------------------------------------------------------
          HOST/SID                  CON_ID PDB_NAME             OPEN_MODE    REST CREATED
          {{ '-' * 88 }}
        {{ _email_detail_pdb }}
        {% endif %}{% endif %}
        {% if collect_adg | default(true) | bool %}{% if not (email_skip_empty_sections | default(false) | bool) or 'no Active' not in _email_detail_adg %}
