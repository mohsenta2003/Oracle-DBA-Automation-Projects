          {{ '-' * 118 }}
        {{ _email_detail_adg }}
        {% endif %}{% endif %}
        {% if collect_rac | default(true) | bool %}{% if not (email_skip_empty_sections | default(false) | bool) or 'no RAC' not in _email_detail_rac %}
