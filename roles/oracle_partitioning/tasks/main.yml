---
# roles/oracle_partitioning/tasks/main.yml
#
# NOTE: This role is READ-ONLY / REPORTING ONLY
# - Checks Oracle Partitioning EE option (v$option + dba_feature_usage_statistics)
# - Reports all partitioned tables and indexes per non-system schema
# - Auto-detects Oracle user, ORACLE_HOME, and all running SIDs
# - Supports MULTIPLE instances on same host
# - Compatible with Linux AND AIX (user:32 for long usernames)
# - Generates per-instance TXT + HTML reports
# - Generates consolidated cross-host TXT + CSV + HTML reports (run_once)
#

  # ============================================
  # Gather minimal facts
  # ============================================
  - name: Gather minimal facts
    ansible.builtin.setup:
      gather_subset:
        - '!all'
        - '!min'
        - date_time
    become: no

  - name: Set report timestamp (date + time to prevent overwrites)
    ansible.builtin.set_fact:
      _report_date: "{{ ansible_date_time.date }}"
      _report_timestamp: "{{ ansible_date_time.date }}_{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}{{ ansible_date_time.second }}"
    run_once: true

  # ============================================
  # Auto-detect Oracle user from PMON process
  # user:32 handles long EU usernames (svcorapeu, svcoradeu) on Linux & AIX
  # ============================================
  - name: Detect Oracle user from PMON process
    ansible.builtin.shell:
      cmd: "ps -eo user:32,args | grep '[o]ra_pmon_' | head -1 | awk '{print $1}'"
    register: detected_oracle_user
    changed_when: false
    become: no
    failed_when: false
    when: oracle_user | default('') == ''

  - name: Set detected Oracle user
    ansible.builtin.set_fact:
      _oracle_user: "{{ oracle_user | default('') or (detected_oracle_user.stdout | default('') | trim) }}"

  - name: Set skip flag if no Oracle detected
    ansible.builtin.set_fact:
      _skip_host: "{{ _oracle_user == '' }}"
      _skip_reason: "{{ 'No Oracle ora_pmon processes found - Oracle database not running on this host' if _oracle_user == '' else '' }}"

  - name: Display skip message
    ansible.builtin.debug:
      msg: "SKIPPING {{ inventory_hostname }}: {{ _skip_reason }}"
    when: _skip_host | bool

  - name: Display detected Oracle user
    ansible.builtin.debug:
      msg: "Detected Oracle owner: {{ _oracle_user }}"
    when: not (_skip_host | bool)

  # ============================================
  # Detect ALL DB instances from PMON processes
  # ============================================
  - name: Detect all database instances from PMON
    ansible.builtin.shell:
      cmd: "ps -eo args | grep '[o]ra_pmon_' | grep -v 'awk' | awk -F'ora_pmon_' '{print $2}' | awk '{print $1}' | sort -u"
    register: pmon_instances
    changed_when: false
    failed_when: false
    become: no
    when: not (_skip_host | bool)

  - name: Debug raw pmon output
    ansible.builtin.debug:
      var: pmon_instances
    when: not (_skip_host | bool)

  - name: Set instances list
    ansible.builtin.set_fact:
      _all_instances: "{{ [db_sid] if (db_sid | default('')) else (pmon_instances.stdout_lines | default([])) }}"
    when: not (_skip_host | bool)

  - name: Set empty instances list for skipped hosts
    ansible.builtin.set_fact:
      _all_instances: []
    when: _skip_host | bool

  - name: Update skip flag if no instances found
    ansible.builtin.set_fact:
      _skip_host: true
      _skip_reason: "No Oracle instances detected on this host"
    when: not (_skip_host | bool) and (_all_instances | length == 0)

  - name: Display detected instances
    ansible.builtin.debug:
      msg: "Found {{ _all_instances | length }} instance(s): {{ _all_instances | join(', ') }}"
    when: not (_skip_host | bool) and (_all_instances | length > 0)

  # ============================================
  # Get ORACLE_HOME mapping from oratab
  # ============================================
  - name: Read oratab
    ansible.builtin.shell:
      cmd: "cat /etc/oratab | grep -v '^#' | grep -v '^$' | grep ':'"
    register: oratab_contents
    changed_when: false
    failed_when: false
    become: no
    when: not (_skip_host | bool)

  - name: Parse oratab into SID->HOME dictionary
    ansible.builtin.set_fact:
      _oratab_map: "{{ _oratab_map | default({}) | combine({item.split(':')[0]: item.split(':')[1]}) }}"
    loop: "{{ oratab_contents.stdout_lines | default([]) }}"
    when: not (_skip_host | bool) and (item | regex_search('^[^:]+:[^:]+'))

  # ============================================
  # Create local report directory
  # ============================================
  - name: Set local report path
    ansible.builtin.set_fact:
      _local_report_dir: "{{ playbook_dir }}/../reports/{{ _report_date }}/{{ inventory_hostname }}"

  - name: Create local reports directory
    ansible.builtin.file:
      path: "{{ _local_report_dir }}"
      state: directory
      mode: '0755'
    delegate_to: localhost
    become: no
    when: not (_skip_host | bool)

  # ============================================
  # Initialize instance results list
  # ============================================
  - name: Initialize instance results list
    ansible.builtin.set_fact:
      _instance_results: []

  # ============================================
  # Check partitioning for each instance
  # ============================================
  - name: Check partitioning for each instance
    ansible.builtin.include_tasks: check_instance.yml
    loop: "{{ _all_instances }}"
    loop_control:
      loop_var: current_sid
    when: not (_skip_host | bool) and (_all_instances | length > 0)

  # ============================================
  # Collect per-host summary for consolidated report
  # ============================================
  - name: Initialize empty instance results for skipped hosts
    ansible.builtin.set_fact:
      _instance_results: []
    when: _skip_host | bool

  - name: Add host results to consolidated list
    ansible.builtin.set_fact:
      _host_partitioning_results: "{{ _host_partitioning_results | default([]) + [{'host': inventory_hostname, 'oracle_user': _oracle_user | default('N/A'), 'instances': _all_instances | default([]), 'results': _instance_results | default([]), 'skipped': _skip_host | default(false), 'skip_reason': _skip_reason | default('')}] }}"

  # ============================================
  # Build summary lists (run_once across all hosts)
  # ============================================
  - name: Build list of instances with Partitioning ENABLED and in use
    ansible.builtin.set_fact:
      _partitioning_inuse_instances: |
        {% for host in ansible_play_hosts %}
        {% set hv = hostvars[host] %}
        {% for r in hv._instance_results | default([]) %}
        {% if r.inuse | bool %}{{ host }}/{{ r.sid }}
        {% endif %}
        {% endfor %}
        {% endfor %}
    run_once: true

  - name: Convert partitioning-in-use list
    ansible.builtin.set_fact:
      _partitioning_inuse_instances: "{{ _partitioning_inuse_instances.split('\n') | map('trim') | select | list }}"
    run_once: true

  - name: Build list of instances with Partitioning option ENABLED but no objects
    ansible.builtin.set_fact:
      _partitioning_licensed_only: |
        {% for host in ansible_play_hosts %}
        {% set hv = hostvars[host] %}
        {% for r in hv._instance_results | default([]) %}
        {% if (r.installed | bool) and not (r.inuse | bool) and not r.is_standby | default(false) %}{{ host }}/{{ r.sid }}
        {% endif %}
        {% endfor %}
        {% endfor %}
    run_once: true

  - name: Convert licensed-only list
    ansible.builtin.set_fact:
      _partitioning_licensed_only: "{{ _partitioning_licensed_only.split('\n') | map('trim') | select | list }}"
    run_once: true

  - name: Build list of instances with Partitioning option DISABLED
    ansible.builtin.set_fact:
      _partitioning_disabled_instances: |
        {% for host in ansible_play_hosts %}
        {% set hv = hostvars[host] %}
        {% for r in hv._instance_results | default([]) %}
        {% if not (r.installed | bool) and not r.is_standby | default(false) %}{{ host }}/{{ r.sid }}
        {% endif %}
        {% endfor %}
        {% endfor %}
    run_once: true

  - name: Convert disabled list
    ansible.builtin.set_fact:
      _partitioning_disabled_instances: "{{ _partitioning_disabled_instances.split('\n') | map('trim') | select | list }}"
    run_once: true

  - name: Build list of standby databases
    ansible.builtin.set_fact:
      _standby_instances: |
        {% for host in ansible_play_hosts %}
        {% set hv = hostvars[host] %}
        {% for r in hv._instance_results | default([]) %}
        {% if r.is_standby | default(false) %}{{ host }}/{{ r.sid }}
        {% endif %}
        {% endfor %}
        {% endfor %}
    run_once: true

  - name: Convert standby list
    ansible.builtin.set_fact:
      _standby_instances: "{{ _standby_instances.split('\n') | map('trim') | select | list }}"
    run_once: true

  - name: Build list of skipped hosts
    ansible.builtin.set_fact:
      _skipped_hosts: |
        {% for host in ansible_play_hosts %}
        {% set hv = hostvars[host] %}
        {% if hv._skip_host | default(false) %}{{ host }} ({{ hv._skip_reason | default('Unknown reason') }})
        {% endif %}
        {% endfor %}
    run_once: true

  - name: Convert skipped hosts list
    ansible.builtin.set_fact:
      _skipped_hosts: "{{ _skipped_hosts.split('\n') | map('trim') | select | list }}"
    run_once: true

  - name: Build list of successful hosts
    ansible.builtin.set_fact:
      _successful_hosts: |
        {% for host in ansible_play_hosts %}
        {% set hv = hostvars[host] %}
        {% if not (hv._skip_host | default(false)) and (hv._instance_results | default([]) | length > 0) %}{{ host }}
        {% endif %}
        {% endfor %}
    run_once: true

  - name: Convert successful hosts list
    ansible.builtin.set_fact:
      _successful_hosts: "{{ _successful_hosts.split('\n') | map('trim') | select | list }}"
    run_once: true

  - name: Build list of failed hosts
    ansible.builtin.set_fact:
      _failed_hosts: |
        {% for host in ansible_play_hosts %}
        {% set hv = hostvars[host] %}
        {% if not (hv._skip_host | default(false)) and (hv._instance_results | default([]) | length == 0) %}{{ host }} ({{ hv._fail_reason | default('No results collected') }})
        {% endif %}
        {% endfor %}
    run_once: true

  - name: Convert failed hosts list
    ansible.builtin.set_fact:
      _failed_hosts: "{{ _failed_hosts.split('\n') | map('trim') | select | list }}"
    run_once: true

  # ============================================
  # Generate consolidated CSV report
  # ============================================
  - name: Set CSV report path
    ansible.builtin.set_fact:
      _csv_report_path: "{{ playbook_dir }}/../reports/{{ _report_date }}/partitioning_results_{{ _report_timestamp }}.csv"
    run_once: true

  - name: Generate CSV report
    ansible.builtin.copy:
      content: |
        SERVER,INSTANCE,DB_ROLE,OPEN_MODE,INSTALLED,IN_USE,FIRST_USED,LAST_SAMPLED,PARTITIONED_TABLES,PARTITIONED_INDEXES,SCHEMAS_USING,LICENSE_REQUIRED
        {% for host in ansible_play_hosts %}
        {% set hv = hostvars[host] %}
        {% for r in hv._instance_results | default([]) %}
        {{ host }},{{ r.sid }},{{ r.db_role | default('UNKNOWN') }},{{ r.open_mode | default('UNKNOWN') }},{{ 'TRUE' if (r.installed | bool) else 'FALSE' }},{{ 'YES' if (r.inuse | bool) else 'NO' }},{{ r.first_used | default('Never') }},{{ r.last_sampled | default('Never') }},{{ r.table_count | default(0) }},{{ r.index_count | default(0) }},{{ r.schema_count | default(0) }},{{ 'YES' if (r.inuse | bool) else 'NO' }}
        {% endfor %}
        {% endfor %}
      dest: "{{ _csv_report_path }}"
    delegate_to: localhost
    become: no
    run_once: true

  # ============================================
  # Generate consolidated TXT report
  # ============================================
  - name: Set consolidated report path
    ansible.builtin.set_fact:
      _consolidated_report_path: "{{ playbook_dir }}/../reports/{{ _report_date }}/partitioning_consolidated_{{ _report_timestamp }}.txt"
    run_once: true

  - name: Generate consolidated TXT report
    ansible.builtin.copy:
      content: |
        ================================================================================
                    ORACLE PARTITIONING OPTION - CONSOLIDATED REPORT
        ================================================================================
        Generated:   {{ ansible_date_time.iso8601 }}
        Total Hosts: {{ ansible_play_hosts | length }}
        ================================================================================

        CHECKED:
        - Oracle Partitioning option status (v$option)
        - First/last usage dates (dba_feature_usage_statistics)
        - Partitioned tables per non-system schema (dba_part_tables)
        - Partitioned indexes per non-system schema (dba_ind_partitions)

        ================================================================================
        SUMMARY TABLE
        ================================================================================

        +----------------------+----------+-------+--------+-----------+--------+--------+----------+----------+
        | SERVER/INSTANCE      | DB ROLE  | INST? | INUSE? | FIRST USE | TABLES | IDXS   | SCHEMAS  | LICENSE  |
        +----------------------+----------+-------+--------+-----------+--------+--------+----------+----------+
        {% for host in ansible_play_hosts %}
        {% set hv = hostvars[host] %}
        {% for r in hv._instance_results | default([]) %}
        {% set license_req = r.inuse | bool %}
        | {{ "%-20s" | format((("[!]" if license_req else "") ~ host ~ "/" ~ r.sid)[:20]) }} | {{ "%-8s" | format(r.db_role[:8]) }} | {{ "%-5s" | format('TRUE' if (r.installed | bool) else 'FALSE') }} | {{ "%-6s" | format('YES' if (r.inuse | bool) else 'NO') }} | {{ "%-9s" | format((r.first_used | default('Never'))[:9]) }} | {{ "%-6s" | format(r.table_count | default(0)) }} | {{ "%-6s" | format(r.index_count | default(0)) }} | {{ "%-8s" | format(r.schema_count | default(0)) }} | {{ "%-8s" | format("REQ" if license_req else "NO") }} |
        {% endfor %}
        {% endfor %}
        +----------------------+----------+-------+--------+-----------+--------+--------+----------+----------+

        Legend: [!] = License required  |  INST?=TRUE means v$option=TRUE  |  INUSE?=YES means partitioned objects exist

        ================================================================================
        IN-USE INSTANCES - DETAIL SUMMARY
        ================================================================================
        {% set _iu_count = [] %}{% for host in ansible_play_hosts %}{% set hv = hostvars[host] %}{% for r in hv._instance_results | default([]) %}{% if r.inuse | bool %}{% set _ = _iu_count.append(1) %}{% endif %}{% endfor %}{% endfor %}
        {% if _iu_count | length > 0 %}
        {% for host in ansible_play_hosts %}
        {% set hv = hostvars[host] %}
        {% for r in hv._instance_results | default([]) %}
        {% if r.inuse | bool %}
          HOST/INSTANCE : {{ host }}/{{ r.sid }}
          DB Role       : {{ r.db_role | default('UNKNOWN') }}
          Open Mode     : {{ r.open_mode | default('UNKNOWN') }}
          Tables        : {{ r.table_count | default(0) }}   Indexes: {{ r.index_count | default(0) }}   Schemas: {{ r.schema_count | default(0) }}   Size: {{ r.total_size_gb | default('0') }} GB
          First Used    : {{ r.first_used | default('Never') }}
          Last Used     : {{ r.last_sampled | default('Never') }}
          Detail File   : reports/{{ _report_date }}/{{ host }}/partitioning_{{ r.sid }}_{{ _report_timestamp }}.html
          ............................................................................
        {% endif %}
        {% endfor %}
        {% endfor %}
        {% else %}
        (No instances are actively using the Partitioning option)
        {% endif %}

        ================================================================================
        INSTANCES USING PARTITIONING (OPTION ENABLED + OBJECTS EXIST):
        ================================================================================
        {% if _partitioning_inuse_instances | default([]) | length > 0 %}
        {% for item in _partitioning_inuse_instances %}
        - {{ item }}
        {% endfor %}
        {% else %}
        (None)
        {% endif %}

        ================================================================================
        INSTANCES WITH OPTION ENABLED BUT NO PARTITIONED OBJECTS:
        ================================================================================
        {% if _partitioning_licensed_only | default([]) | length > 0 %}
        {% for item in _partitioning_licensed_only %}
        - {{ item }}
        {% endfor %}
        {% else %}
        (None)
        {% endif %}

        ================================================================================
        INSTANCES WITH PARTITIONING OPTION DISABLED / NOT LICENSED:
        ================================================================================
        {% if _partitioning_disabled_instances | default([]) | length > 0 %}
        {% for item in _partitioning_disabled_instances %}
        - {{ item }}
        {% endfor %}
        {% else %}
        (None - All instances have Partitioning option enabled)
        {% endif %}

        ================================================================================
        STANDBY / MOUNTED DATABASES (CANNOT QUERY - CHECK PRIMARY):
        ================================================================================
        {% if _standby_instances | default([]) | length > 0 %}
        {% for item in _standby_instances %}
        - {{ item }}
        {% endfor %}
        {% else %}
        (None)
        {% endif %}

        ================================================================================
        SKIPPED HOSTS (NO ORACLE RUNNING):
        ================================================================================
        {% if _skipped_hosts | default([]) | length > 0 %}
        {% for item in _skipped_hosts %}
        - {{ item }}
        {% endfor %}
        {% else %}
        (None - All hosts have Oracle instances)
        {% endif %}

        ================================================================================
        FAILED HOSTS (ERRORS DURING EXECUTION):
        ================================================================================
        {% if _failed_hosts | default([]) | length > 0 %}
        {% for item in _failed_hosts %}
        - {{ item }}
        {% endfor %}
        {% else %}
        (None)
        {% endif %}

        NOTE: Unreachable hosts (SSH failures) are not listed here.
              Check Ansible output for hosts marked UNREACHABLE.

        ================================================================================
        HOST STATUS SUMMARY
        ================================================================================
        Successful Hosts:            {{ _successful_hosts | default([]) | length }}
        Skipped (No Oracle):         {{ _skipped_hosts | default([]) | length }}
        Failed (Execution Errors):   {{ _failed_hosts | default([]) | length }}
        -------------------------------------------------------------------------------
        Total Hosts Processed:       {{ ansible_play_hosts | length }}

        ================================================================================
        INSTANCE TOTALS
        ================================================================================
        Total Instances Checked:     {% set total = [] %}{% for host in ansible_play_hosts %}{% set hv = hostvars[host] %}{% for r in hv._instance_results | default([]) %}{% set _ = total.append(1) %}{% endfor %}{% endfor %}{{ total | length }}
        Instances Using Partitioning:{{ _partitioning_inuse_instances | default([]) | length }}
        Option Enabled, No Objects:  {{ _partitioning_licensed_only | default([]) | length }}
        Option Disabled:             {{ _partitioning_disabled_instances | default([]) | length }}
        Standby/Mounted (skipped):   {{ _standby_instances | default([]) | length }}

        CSV FILE: partitioning_results_{{ _report_timestamp }}.csv (for spreadsheet analysis)

        ================================================================================
                              END OF CONSOLIDATED REPORT
        ================================================================================
      dest: "{{ _consolidated_report_path }}"
    delegate_to: localhost
    become: no
    run_once: true

  # ============================================
  # Generate consolidated HTML report
  # ============================================
  - name: Set HTML consolidated report path
    ansible.builtin.set_fact:
      _html_consolidated_path: "{{ playbook_dir }}/../reports/{{ _report_date }}/partitioning_report_{{ _report_timestamp }}.html"
    run_once: true

  - name: Generate consolidated HTML report
    ansible.builtin.copy:
      content: |
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Oracle Partitioning Report - {{ ansible_date_time.iso8601 }}</title>
            <style>
                :root {
                    --primary: #1e3a8a;
                    --bg-gray: #f8fafc;
                    --border: #e2e8f0;
                    --text-main: #1e293b;
                    --text-muted: #64748b;
                    --status-used-bg: #fee2e2;
                    --status-used-text: #991b1b;
                    --status-ok-bg: #dcfce7;
                    --status-ok-text: #166534;
                    --status-off-bg: #f1f5f9;
                    --status-off-text: #475569;
                }
                body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background-color: #f1f5f9; color: var(--text-main); margin: 0; padding: 40px; line-height: 1.5; }
                .container { max-width: 1200px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
                h1 { color: var(--primary); font-size: 1.75rem; border-bottom: 2px solid var(--bg-gray); padding-bottom: 20px; margin-bottom: 30px; }
                h2 { font-size: 1.25rem; color: #334155; margin-top: 40px; margin-bottom: 20px; border-left: 4px solid var(--primary); padding-left: 15px; }
                .header-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; background: var(--bg-gray); padding: 25px; border-radius: 8px; border: 1px solid var(--border); }
                .info-item strong { color: var(--text-muted); display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
                .info-item span { font-weight: 600; color: var(--text-main); }
                .status-badge { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
                .status-inuse  { background-color: var(--status-used-bg); color: var(--status-used-text); border: 1px solid #fecaca; }
                .status-enabled { background-color: var(--status-ok-bg); color: var(--status-ok-text); border: 1px solid #bbf7d0; }
                .status-disabled { background-color: var(--status-off-bg); color: var(--status-off-text); border: 1px solid var(--border); }
                table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
                th { background-color: var(--bg-gray); color: var(--text-muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 14px 16px; text-align: left; border-bottom: 2px solid var(--border); }
                td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 0.875rem; vertical-align: middle; }
                tr:last-child td { border-bottom: none; }
                tr:hover { background-color: #fcfdfe; }
                .col-host { font-weight: 600; color: var(--primary); }
                .col-num  { text-align: center; }
                .col-license { text-align: center; font-weight: 700; }
                .license-yes { color: #ef4444; }
                .license-no  { color: #94a3b8; }
                .footer { margin-top: 50px; padding-top: 20px; text-align: center; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid var(--border); }
                .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin: 20px 0; }
                .summary-card { background: var(--bg-gray); padding: 20px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
                .summary-card .num { font-size: 2rem; font-weight: 700; color: var(--primary); }
                .summary-card .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 5px; }
                .host-list { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; margin: 10px 0 20px; }
                .host-list li { padding: 10px 14px; border-radius: 6px; background: var(--bg-gray); font-size: 0.875rem; font-weight: 500; border-left: 4px solid var(--border); }
                .host-list.danger li { border-left-color: #ef4444; background: #fff7f7; }
                .host-list.success li { border-left-color: #22c55e; }
                .host-list.neutral li { border-left-color: #94a3b8; }
            </style>
        </head>
        <body>
            <div class="container">
                <h1>&#x1F5C3; Oracle Partitioning Option Report</h1>
                <div class="header-info">
                    <div class="info-item"><strong>Generated</strong><span>{{ ansible_date_time.iso8601 }}</span></div>
                    <div class="info-item"><strong>Total Hosts</strong><span>{{ ansible_play_hosts | length }}</span></div>
                    <div class="info-item"><strong>Successful</strong><span>{{ _successful_hosts | default([]) | length }}</span></div>
                    <div class="info-item"><strong>Skipped</strong><span>{{ _skipped_hosts | default([]) | length }}</span></div>
                </div>

                <div class="summary-grid">
                    <div class="summary-card">
                        <div class="num">{{ _partitioning_inuse_instances | default([]) | length }}</div>
                        <div class="label">Using Partitioning</div>
                    </div>
                    <div class="summary-card">
                        <div class="num">{{ _partitioning_licensed_only | default([]) | length }}</div>
                        <div class="label">Option ON, No Objects</div>
                    </div>
                    <div class="summary-card">
                        <div class="num">{{ _partitioning_disabled_instances | default([]) | length }}</div>
                        <div class="label">Option Disabled</div>
                    </div>
                    <div class="summary-card">
                        <div class="num">{{ _standby_instances | default([]) | length }}</div>
                        <div class="label">Standby (Skipped)</div>
                    </div>
                </div>

                <h2>Results by Instance</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Server / Instance</th>
                            <th>DB Role</th>
                            <th>Open Mode</th>
                            <th>Installed? (v$option)</th>
                            <th>In-Use? (Objects)</th>
                            <th class="col-num">Tables</th>
                            <th class="col-num">Indexes</th>
                            <th class="col-num">Schemas</th>
                            <th class="col-num">Part. Size (GB)</th>
                            <th class="col-num">DB Total (GB)</th>
                            <th>First Used</th>
                            <th>Last Used</th>
                            <th class="col-license">License?</th>
                        </tr>
                    </thead>
                    <tbody>
                        {# ── GROUP 1: IN-USE — License Required ── #}
                        {% if _partitioning_inuse_instances | default([]) | length > 0 %}
                        <tr><td colspan="13" style="background:#b91c1c;color:white;font-weight:700;font-size:0.72rem;text-transform:uppercase;padding:6px 16px;letter-spacing:0.07em;">&#x1F534;&nbsp; IN-USE &mdash; LICENSE REQUIRED &nbsp;({{ _partitioning_inuse_instances | default([]) | length }} instance{{ 's' if _partitioning_inuse_instances | default([]) | length != 1 else '' }})</td></tr>
                        {% for host in ansible_play_hosts %}
                        {% set hv = hostvars[host] %}
                        {% for r in hv._instance_results | default([]) %}
                        {% if r.inuse | bool %}
                        <tr style="background:#fff7f7;">
                            <td class="col-host" style="border-left:4px solid #ef4444;">{{ host }}<br><a href="{{ host }}/{{ r.report_file }}" target="_blank" style="color:#dc2626;font-weight:700;text-decoration:none;">&#x1F517; {{ r.sid }}</a></td>
                            <td>{{ r.db_role | default('UNKNOWN') }}</td>
                            <td>{{ r.open_mode | default('UNKNOWN') }}</td>
                            <td><span class="status-badge status-enabled">TRUE</span></td>
                            <td><span class="status-badge status-inuse">YES</span></td>
                            <td class="col-num">{{ r.table_count | default(0) }}</td>
                            <td class="col-num">{{ r.index_count | default(0) }}</td>
                            <td class="col-num">{{ r.schema_count | default(0) }}</td>
                            <td class="col-num" style="color:#dc2626;font-weight:600;">{{ r.total_size_gb | default('0') }}</td>
                            <td class="col-num">{{ r.db_total_size_gb | default('0') }}</td>
                            <td>{{ r.first_used | default('Never') }}</td>
                            <td>{{ r.last_sampled | default('Never') }}</td>
                            <td class="col-license license-yes">YES</td>
                        </tr>
                        {% endif %}
                        {% endfor %}
                        {% endfor %}
                        {% endif %}
                        {# ── GROUP 2: INSTALLED, NO OBJECTS ── #}
                        {% if _partitioning_licensed_only | default([]) | length > 0 %}
                        <tr><td colspan="13" style="background:#15803d;color:white;font-weight:700;font-size:0.72rem;text-transform:uppercase;padding:6px 16px;letter-spacing:0.07em;">&#x2705;&nbsp; OPTION ENABLED &mdash; NO PARTITIONED OBJECTS &nbsp;({{ _partitioning_licensed_only | default([]) | length }} instance{{ 's' if _partitioning_licensed_only | default([]) | length != 1 else '' }})</td></tr>
                        {% for host in ansible_play_hosts %}
                        {% set hv = hostvars[host] %}
                        {% for r in hv._instance_results | default([]) %}
                        {% if (r.installed | bool) and not (r.inuse | bool) and not (r.is_standby | default(false)) %}
                        <tr>
                            <td class="col-host" style="border-left:4px solid #22c55e;">{{ host }}<br>{% if r.report_file | default('') != '' %}<a href="{{ host }}/{{ r.report_file }}" target="_blank" style="color:var(--primary);font-weight:700;text-decoration:none;">{{ r.sid }}</a>{% else %}<span style="color:var(--text-muted);">{{ r.sid }}</span>{% endif %}</td>
                            <td>{{ r.db_role | default('UNKNOWN') }}</td>
                            <td>{{ r.open_mode | default('UNKNOWN') }}</td>
                            <td><span class="status-badge status-enabled">TRUE</span></td>
                            <td><span class="status-badge status-disabled">NO</span></td>
                            <td class="col-num">{{ r.table_count | default(0) }}</td>
                            <td class="col-num">{{ r.index_count | default(0) }}</td>
                            <td class="col-num">{{ r.schema_count | default(0) }}</td>
                            <td class="col-num">{{ r.total_size_gb | default('0') }}</td>
                            <td class="col-num">{{ r.db_total_size_gb | default('0') }}</td>
                            <td>{{ r.first_used | default('Never') }}</td>
                            <td>{{ r.last_sampled | default('Never') }}</td>
                            <td class="col-license license-no">NO</td>
                        </tr>
                        {% endif %}
                        {% endfor %}
                        {% endfor %}
                        {% endif %}
                        {# ── GROUP 3: OPTION DISABLED ── #}
                        {% if _partitioning_disabled_instances | default([]) | length > 0 %}
                        <tr><td colspan="13" style="background:#475569;color:white;font-weight:700;font-size:0.72rem;text-transform:uppercase;padding:6px 16px;letter-spacing:0.07em;">&#x274C;&nbsp; OPTION DISABLED &mdash; NO LICENSE REQUIRED &nbsp;({{ _partitioning_disabled_instances | default([]) | length }} instance{{ 's' if _partitioning_disabled_instances | default([]) | length != 1 else '' }})</td></tr>
                        {% for host in ansible_play_hosts %}
                        {% set hv = hostvars[host] %}
                        {% for r in hv._instance_results | default([]) %}
                        {% if not (r.installed | bool) and not (r.is_standby | default(false)) %}
                        <tr style="opacity:0.8;">
                            <td class="col-host" style="border-left:4px solid #94a3b8;">{{ host }}<br><span style="color:var(--text-muted);font-size:0.85rem;">{{ r.sid }}</span></td>
                            <td>{{ r.db_role | default('UNKNOWN') }}</td>
                            <td>{{ r.open_mode | default('UNKNOWN') }}</td>
                            <td><span class="status-badge status-disabled">FALSE</span></td>
                            <td><span class="status-badge status-disabled">NO</span></td>
                            <td class="col-num" style="color:var(--text-muted);">—</td>
                            <td class="col-num" style="color:var(--text-muted);">—</td>
                            <td class="col-num" style="color:var(--text-muted);">—</td>
                            <td class="col-num" style="color:var(--text-muted);">—</td>
                            <td class="col-num" style="color:var(--text-muted);">—</td>
                            <td style="color:var(--text-muted);">—</td>
                            <td style="color:var(--text-muted);">—</td>
                            <td class="col-license license-no">NO</td>
                        </tr>
                        {% endif %}
                        {% endfor %}
                        {% endfor %}
                        {% endif %}
                        {# ── GROUP 4: STANDBY ── #}
                        {% if _standby_instances | default([]) | length > 0 %}
                        <tr><td colspan="13" style="background:#64748b;color:white;font-weight:700;font-size:0.72rem;text-transform:uppercase;padding:6px 16px;letter-spacing:0.07em;">&#x23F8;&nbsp; STANDBY / MOUNTED &mdash; NOT QUERIED &nbsp;({{ _standby_instances | default([]) | length }} instance{{ 's' if _standby_instances | default([]) | length != 1 else '' }})</td></tr>
                        {% for host in ansible_play_hosts %}
                        {% set hv = hostvars[host] %}
                        {% for r in hv._instance_results | default([]) %}
                        {% if r.is_standby | default(false) %}
                        <tr style="opacity:0.6;">
                            <td class="col-host" style="border-left:4px solid #cbd5e1;">{{ host }}<br><span style="color:var(--text-muted);font-size:0.85rem;">{{ r.sid }}</span></td>
                            <td>{{ r.db_role | default('UNKNOWN') }}</td>
                            <td>{{ r.open_mode | default('UNKNOWN') }}</td>
                            <td><span class="status-badge status-disabled">STANDBY</span></td>
                            <td><span class="status-badge status-disabled">N/A</span></td>
                            <td class="col-num" style="color:var(--text-muted);">—</td>
                            <td class="col-num" style="color:var(--text-muted);">—</td>
                            <td class="col-num" style="color:var(--text-muted);">—</td>
                            <td class="col-num" style="color:var(--text-muted);">—</td>
                            <td class="col-num" style="color:var(--text-muted);">—</td>
                            <td style="color:var(--text-muted);">—</td>
                            <td style="color:var(--text-muted);">—</td>
                            <td class="col-license license-no">N/A</td>
                        </tr>
                        {% endif %}
                        {% endfor %}
                        {% endfor %}
                        {% endif %}
                        {# ── GROUP 5: SKIPPED HOSTS ── #}
                        {% for host in ansible_play_hosts %}
                        {% set hv = hostvars[host] %}
                        {% if hv._skip_host | default(false) %}
                        <tr style="opacity:0.6;">
                            <td class="col-host">{{ host }}</td>
                            <td colspan="12" style="color: var(--text-muted); font-style: italic;">SKIPPED: {{ hv._skip_reason | default('No Oracle running') }}</td>
                        </tr>
                        {% endif %}
                        {% endfor %}
                    </tbody>
                </table>

                <h2>&#x26A0;&#xFE0F; License Summary</h2>

                <h3 style="font-size:1rem;color:#334155;margin:15px 0 8px;">&#x1F534; Instances Using Partitioning &mdash; License Required ({{ _partitioning_inuse_instances | default([]) | length }})</h3>
                {% if _partitioning_inuse_instances | default([]) | length > 0 %}
                <ul class="host-list danger">
                    {% for host in ansible_play_hosts %}
                    {% set hv = hostvars[host] %}
                    {% for r in hv._instance_results | default([]) %}
                    {% if r.inuse | bool %}
                    <li>
                        <strong>{{ host }}/{{ r.sid }}</strong>
                        &mdash; Tables: {{ r.table_count | default(0) }}, Indexes: {{ r.index_count | default(0) }}, Schemas: {{ r.schema_count | default(0) }}, Size: {{ r.total_size_gb | default('0') }} GB
                        {% if r.report_file | default('') != '' %}
                        &mdash; <a href="{{ host }}/{{ r.report_file }}" target="_blank" style="color:#dc2626;font-size:0.8rem;">&#x1F517; detail report</a>
                        {% endif %}
                    </li>
                    {% endif %}
                    {% endfor %}
                    {% endfor %}
                </ul>
                {% else %}
                <p style="color:var(--text-muted);font-style:italic;margin:8px 0 20px;">No instances are actively using the Partitioning option.</p>
                {% endif %}

                <h3 style="font-size:1rem;color:#334155;margin:15px 0 8px;">&#x2705; Option Installed, No Objects &mdash; No License Required ({{ _partitioning_licensed_only | default([]) | length }})</h3>
                {% if _partitioning_licensed_only | default([]) | length > 0 %}
                <ul class="host-list success">
                    {% for item in _partitioning_licensed_only %}
                    <li>{{ item }}</li>
                    {% endfor %}
                </ul>
                {% else %}
                <p style="color:var(--text-muted);font-style:italic;margin:8px 0 20px;">None</p>
                {% endif %}

                <h3 style="font-size:1rem;color:#334155;margin:15px 0 8px;">&#x23F8;&#xFE0F; Standby Databases &mdash; Not Queried ({{ _standby_instances | default([]) | length }})</h3>
                {% if _standby_instances | default([]) | length > 0 %}
                <ul class="host-list neutral">
                    {% for item in _standby_instances %}
                    <li>{{ item }}</li>
                    {% endfor %}
                </ul>
                {% else %}
                <p style="color:var(--text-muted);font-style:italic;margin:8px 0 20px;">None</p>
                {% endif %}

                <div class="footer">
                    Oracle DBA Automation &mdash; Partitioning Option Report &mdash; {{ ansible_date_time.iso8601 }}<br>
                    CSV: partitioning_results_{{ _report_timestamp }}.csv &nbsp;|&nbsp;
                    TXT: partitioning_consolidated_{{ _report_timestamp }}.txt
                </div>
            </div>
        </body>
        </html>
      dest: "{{ _html_consolidated_path }}"
    delegate_to: localhost
    become: no
    run_once: true

  # ============================================
  # Final console summary
  # ============================================
  - name: Display final console summary
    ansible.builtin.debug:
      msg: |

        ========================================
        PARTITIONING CHECK COMPLETE
        ========================================
        Host:              {{ inventory_hostname }}
        Instances checked: {{ _all_instances | length }}
        {% for r in _instance_results | default([]) %}
        - {{ r.sid }}: Installed={{ r.installed | default('FALSE') }}, In-Use={{ r.inuse | default('NO') }}, Tables={{ r.table_count }}, Indexes={{ r.index_count }}
        {% endfor %}
        Reports: reports/{{ _report_date }}/{{ inventory_hostname }}/
        ========================================
    run_once: false

  - name: Display consolidated report locations
    ansible.builtin.debug:
      msg: |

        ========================================
        CONSOLIDATED REPORTS SAVED
        ========================================
        TXT : reports/{{ _report_date }}/partitioning_consolidated_{{ _report_timestamp }}.txt
        CSV : reports/{{ _report_date }}/partitioning_results_{{ _report_timestamp }}.csv
        HTML: reports/{{ _report_date }}/partitioning_report_{{ _report_timestamp }}.html
        ========================================
    run_once: true
